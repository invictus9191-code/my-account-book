<head>

<body>
    <div id="pull-to-refresh-indicator" style="position: fixed; top: -60px; left: 0; width: 100%; height: 60px; display: flex; align-items: center; justify-content: center; background: #f6f8fa; color: #57606a; z-index: 2000; transition: transform 0.2s; font-size: 0.9rem; font-weight: 500; border-bottom: none;">
        <span id="pull-to-refresh-text">↓ 당겨서 새로고침</span>
    </div>
    <div id="root">
        <div style="color: #24292f; padding: 20px; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center;">
            <div id="loading-text">화면을 불러오는 중입니다. 잠시만 기다려 주세요...</div>
            <div id="error-display" style="display: none; color: #cf222e; margin-top: 20px; font-size: 0.9rem; background: #ffebe9; padding: 15px; border-radius: 8px; border: 1px solid rgba(208, 215, 222, 0.8); max-width: 90%; word-break: break-all;"></div>
            <button id="manual-reload" style="display: none; margin-top: 20px; padding: 10px 20px; background: #0969da; color: white; border-radius: 8px; border: none; font-weight: 600; cursor: pointer;" onclick="location.reload()">새로고침 하기</button>
            <button id="clear-storage" style="display: none; margin-top: 10px; padding: 10px 20px; background: #57606a; color: white; border-radius: 8px; border: none; font-weight: 600; cursor: pointer;" onclick="if(confirm('데이터를 초기화하시겠습니까? (저장된 정보가 삭제됩니다)')){localStorage.clear(); location.reload();}">데이터 초기화 후 새로고침</button>
        </div>
    </div>
    <script>
        // 에러 핸들러
        window.onerror = function(message, source, lineno, colno, error) {
            var display = document.getElementById('error-display');
            if (display) {
                display.style.display = 'block';
                display.innerHTML = '<strong>오류 발생:</strong><br>' + message + (lineno ? '<br>줄 번호: ' + lineno : '');
            }
            return false;
        };

        // 당겨서 새로고침
        (function() {
            var touchStartY = 0;
            var isIndependentScrollGesture = false;

            document.addEventListener('touchstart', function(e) {
                touchStartY = e.touches[0].clientY;
                isIndependentScrollGesture = !!(e.target.closest && e.target.closest('.budget-modal-sheet, .asset-modal-form, .transaction-modal-form, .month-picker-list, .modal-content'));
            }, { passive: true });

            document.addEventListener('touchmove', function(e) {
                if (isIndependentScrollGesture) return;
                var content = document.querySelector('.main-content');
                var isPullingDown = e.touches[0].clientY > touchStartY;

                if (content && content.scrollTop <= 0 && isPullingDown) {
                    e.preventDefault();
                }
            }, { passive: false });

            document.addEventListener('touchend', function() {
                isIndependentScrollGesture = false;
            }, { passive: true });
        })();

        (function() {
            var startY = 0;
            var pulling = false;
            var threshold = 100;
            var indicator = document.getElementById('pull-to-refresh-indicator');
            var text = document.getElementById('pull-to-refresh-text');

            if (false) {
            window.addEventListener('touchstart', function(e) {
                if (window.scrollY === 0) {
                    startY = e.touches[0].pageY;
                    pulling = true;
                }
            }, { passive: true });

            window.addEventListener('touchmove', function(e) {
                if (!pulling) return;
                var currentY = e.touches[0].pageY;
                var diff = currentY - startY;
                if (diff > 0 && window.scrollY === 0) {
                    var translateY = Math.min(diff * 0.5, threshold + 20);
                    indicator.style.transform = 'translateY(' + translateY + 'px)';
                    text.innerText = (diff * 0.5 > threshold) ? '↺ 놓아서 새로고침' : '↓ 당겨서 새로고침';
                }
            }, { passive: true });

            window.addEventListener('touchend', function(e) {
                if (!pulling) return;
                var diff = e.changedTouches[0].pageY - startY;
                if (diff * 0.5 > threshold && window.scrollY === 0) {
                    text.innerText = '새로고침 중...';
                    indicator.style.transform = 'translateY(0)';
                } else {
                    indicator.style.transform = 'translateY(0)';
                }
                pulling = false;
            });
            }

            setTimeout(function() {
                var btn = document.getElementById('manual-reload');
                if (document.getElementById('loading-text') && document.getElementById('loading-text').offsetParent !== null) {
                    if (btn) btn.style.display = 'block';
                }
            }, 6000);

            window.__deferredPwaInstallPrompt = null;
            window.addEventListener('beforeinstallprompt', function(event) {
                event.preventDefault();
                window.__deferredPwaInstallPrompt = event;
                window.dispatchEvent(new CustomEvent('pwa-install-available'));
            });
        })();
    </script>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const STORAGE_KEY = 'INV_HOUSEHOLD_DATA';
        const FIREBASE_CONFIG_KEY = 'INV_FIREBASE_CONFIG';
        const PASSWORD_KEY = 'INV_APP_PASSWORD';
        const SHARED_ID_KEY = 'INV_SHARED_ID';
        const ASSET_AMOUNT_HIDDEN_KEY = 'INV_ASSET_AMOUNT_HIDDEN';
        const NOTIFICATION_VAPID_KEY = 'INV_NOTIFICATION_VAPID_KEY';
        const NOTIFICATION_ENABLED_KEY = 'INV_NOTIFICATION_ENABLED';
        const NOTIFICATION_TOKEN_KEY = 'INV_NOTIFICATION_TOKEN';
        const NOTIFICATION_DEVICE_ID_KEY = 'INV_NOTIFICATION_DEVICE_ID';
        const TWELVE_DATA_API_KEY = 'INV_TWELVE_DATA_API_KEY';
        const KOREA_MARKET_API_KEY = 'INV_KOREA_MARKET_API_KEY';
        const KOREA_STOCK_API_KEY = 'INV_KOREA_STOCK_API_KEY';
        const KOREA_ETF_API_KEY = 'INV_KOREA_ETF_API_KEY';
        const STOCK_QUOTE_MAX_AGE_MS = 12 * 60 * 60 * 1000;
        const DEFAULT_PASSWORD = '9999';

        const initialData = {
            owners: [{ id: 'o1', name: '홍길동' }],
            groups: [{ id: 'g1', name: '주거래', priority: 1 }],
            assets: [{ id: 'a1', ownerId: 'o1', groupId: 'g1', name: '현금', type: 'Cash', initialBalance: 0 }],
            categories: [
                { id: 'ex1', type: 'Expense', name: '식비' }, { id: 'ex2', type: 'Expense', name: '카페/간식' },
                { id: 'ex3', type: 'Expense', name: '외식/배달' }, { id: 'ex4', type: 'Expense', name: '생활용품' },
                { id: 'ex5', type: 'Expense', name: '교통' }, { id: 'ex6', type: 'Expense', name: '주거/통신' },
                { id: 'ex7', type: 'Expense', name: '건강' }, { id: 'ex8', type: 'Expense', name: '문화' },
                { id: 'ex9', type: 'Expense', name: '여행' }, { id: 'ex10', type: 'Expense', name: '교육' },
                { id: 'ex11', type: 'Expense', name: '경조사' }, { id: 'ex12', type: 'Expense', name: '대출' },
                { id: 'ex13', type: 'Expense', name: '부모님' }, { id: 'ex14', type: 'Expense', name: '미용' },
                { id: 'ex15', type: 'Expense', name: '용돈' }, { id: 'ex16', type: 'Expense', name: '기타' },
                { id: 'in1', type: 'Income', name: '급여' }, { id: 'in2', type: 'Income', name: '금융수입' },
                { id: 'in3', type: 'Income', name: '기타수입' }, { id: 'in4', type: 'Income', name: '보너스' },
                { id: 'tr1', type: 'Transfer', name: '저축' }, { id: 'tr2', type: 'Transfer', name: '이체' }
            ],
            transactions: [],
            stockTransactions: [],
            budgets: [],
            recurringTransactions: [],
            shoppingItems: [],
            shoppingFavorites: [],
            assetTypes: [],
            assetTypeLabels: {},
            marketDataApiKey: '',
            koreaMarketApiKey: '',
            koreaStockApiKey: '',
            koreaEtfApiKey: ''
        };

        const getGroupPriority = (group, fallbackIndex = 0) => {
            const value = group?.priority ?? group?.order;
            if (value !== undefined && value !== null && value !== '' && Number.isFinite(Number(value))) {
                return Math.max(1, Math.floor(Number(value)));
            }
            return fallbackIndex + 1;
        };

        const sortGroupsByPriority = (groups = []) => groups
            .map((group, index) => ({ group, index, priority: getGroupPriority(group, index) }))
            .sort((a, b) => a.priority - b.priority || a.index - b.index)
            .map(({ group }) => group);

        const BASE_ASSET_TYPES = [
            { value: 'Cash', label: '현금' },
            { value: 'Bank', label: '은행' },
            { value: 'Savings', label: '예적금' },
            { value: 'HousingSubscription', label: '청약' },
            { value: 'Pension', label: '연금' },
            { value: 'Stock', label: '주식' },
            { value: 'Card', label: '카드' },
            { value: 'RealEstate', label: '부동산' }
        ];
        const getAssetTypes = data => [
            ...BASE_ASSET_TYPES.map(type => ({ ...type, label: data?.assetTypeLabels?.[type.value] || type.label })),
            ...(data?.assetTypes || []).map(type => ({ value: type.value || `CustomAssetType-${type.id}`, label: type.label || type.name }))
        ];
        const getAssetTypeLabel = (type, data) => getAssetTypes(data).find(item => item.value === type)?.label || '기타';

        const fetchTwelveDataJson = async (path, params, apiKey) => {
            if (!apiKey) throw new Error('Twelve Data API 키가 필요합니다.');
            const url = new URL(`https://api.twelvedata.com/${path}`);
            Object.entries(params).forEach(([key, value]) => url.searchParams.set(key, value));
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 12000);
            try {
                const response = await fetch(url.toString(), { signal: controller.signal, headers: { Authorization: `apikey ${apiKey}` } });
                const result = await response.json();
                if (!response.ok || result.status === 'error' || result.code) throw new Error(result.message || '시장 데이터를 불러오지 못했습니다.');
                return result;
            } catch (error) {
                if (error.name === 'AbortError') throw new Error('시장 데이터 요청 시간이 초과되었습니다.');
                throw error;
            } finally {
                clearTimeout(timeout);
            }
        };

        const createStockHolding = (overrides = {}) => ({
            id: overrides.id || `stock-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
            symbol: overrides.symbol || '',
            quantity: overrides.quantity ?? '',
            currency: overrides.currency || '',
            previousClose: overrides.previousClose ?? '',
            exchangeRate: overrides.exchangeRate ?? 1,
            priceDate: overrides.priceDate || '',
            quoteUpdatedAt: overrides.quoteUpdatedAt || '',
            priceProvider: overrides.priceProvider || '',
            stockName: overrides.stockName || '',
            ledgerBaseQuantity: overrides.ledgerBaseQuantity
        });

        const getStockHoldings = asset => {
            if (Array.isArray(asset?.stockHoldings) && asset.stockHoldings.length > 0) {
                return asset.stockHoldings.map((holding, index) => createStockHolding({
                    ...holding,
                    id: holding.id || `holding-${asset.id || 'asset'}-${index + 1}`
                }));
            }
            if (asset?.stockSymbol) {
                return [createStockHolding({
                    id: `holding-${asset.id || 'legacy'}-1`,
                    symbol: asset.stockSymbol,
                    quantity: asset.stockQuantity,
                    currency: asset.stockCurrency,
                    previousClose: asset.stockPreviousClose,
                    exchangeRate: asset.stockExchangeRate,
                    priceDate: asset.stockPriceDate,
                    quoteUpdatedAt: asset.stockQuoteUpdatedAt
                })];
            }
            return [];
        };

        const getStockHoldingValue = holding => Math.round(
            Number(holding.quantity || 0) * Number(holding.previousClose || 0) * Number(holding.exchangeRate || 1)
        );

        const getStockSymbolKey = symbol => getKoreanStockCode(symbol) || String(symbol || '').trim().toUpperCase();

        const getStockHoldingQuantityAtDate = (asset, holding, stockTransactions = [], upToDate = '') => {
            if (holding.ledgerBaseQuantity === undefined || holding.ledgerBaseQuantity === null) return Number(holding.quantity || 0);
            const symbolKey = getStockSymbolKey(holding.symbol);
            return stockTransactions.reduce((quantity, transaction) => {
                if (transaction.assetId !== asset.id || getStockSymbolKey(transaction.symbol) !== symbolKey) return quantity;
                if (upToDate && transaction.date > upToDate) return quantity;
                const amount = Number(transaction.quantity || 0);
                return quantity + (transaction.type === 'Sell' ? -amount : amount);
            }, Number(holding.ledgerBaseQuantity || 0));
        };

        const getStockAssetValuationFields = holdings => {
            const first = holdings[0] || {};
            return {
                stockHoldings: holdings,
                initialBalance: holdings.reduce((sum, holding) => sum + getStockHoldingValue(holding), 0),
                // 첫 종목 필드는 기존 데이터 및 이전 버전과의 호환을 위해 유지합니다.
                stockSymbol: first.symbol || '',
                stockQuantity: Number(first.quantity || 0),
                stockCurrency: first.currency || '',
                stockPreviousClose: Number(first.previousClose || 0),
                stockExchangeRate: Number(first.exchangeRate || 1),
                stockPriceDate: first.priceDate || '',
                stockQuoteUpdatedAt: first.quoteUpdatedAt || ''
            };
        };

        const getKoreanStockCode = symbol => {
            const match = String(symbol || '').trim().toUpperCase().match(/^(\d{6})(?::(?:KRX|KOSPI|KOSDAQ))?$/);
            return match ? match[1] : '';
        };

        const normalizePublicDataApiKey = apiKey => {
            const value = String(apiKey || '').trim();
            if (!value.includes('%')) return value;
            try { return decodeURIComponent(value); } catch (_) { return value; }
        };

        const getKoreaMarketApiKeys = (data = {}, overrides = {}) => {
            const legacyKey = overrides.legacyKey ?? (data.koreaMarketApiKey || localStorage.getItem(KOREA_MARKET_API_KEY) || '');
            return {
                stock: Object.prototype.hasOwnProperty.call(overrides, 'stock') ? overrides.stock : (data.koreaStockApiKey || localStorage.getItem(KOREA_STOCK_API_KEY) || legacyKey),
                etf: Object.prototype.hasOwnProperty.call(overrides, 'etf') ? overrides.etf : (data.koreaEtfApiKey || localStorage.getItem(KOREA_ETF_API_KEY) || legacyKey)
            };
        };

        const fetchPublicDataMarketItem = async (serviceName, operation, stockCode, apiKey) => {
            if (!apiKey) throw new Error('공공데이터포털 API 키가 필요합니다.');
            const url = new URL(`https://apis.data.go.kr/1160100/${serviceName}/${operation}`);
            url.searchParams.set('serviceKey', normalizePublicDataApiKey(apiKey));
            url.searchParams.set('resultType', 'json');
            url.searchParams.set('numOfRows', '10');
            url.searchParams.set('pageNo', '1');
            // 금융위원회 V2 시세 API는 종목코드 검색에 likeSrtnCd를 사용합니다.
            // srtnCd는 응답 필드여서 요청에 넣어도 필터가 적용되지 않습니다.
            url.searchParams.set('likeSrtnCd', stockCode);
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 12000);
            try {
                const response = await fetch(url.toString(), { signal: controller.signal });
                const result = await response.json().catch(() => null);
                const serviceError = result?.OpenAPI_ServiceResponse?.cmmMsgHeader;
                if (serviceError) {
                    const reason = serviceError.returnAuthMsg || serviceError.errMsg || '공공데이터포털 인증 오류';
                    const code = serviceError.returnReasonCode ? ` (${serviceError.returnReasonCode})` : '';
                    throw new Error(`${reason}${code}`);
                }
                const header = result?.response?.header;
                if (!response.ok || (header?.resultCode && header.resultCode !== '00')) {
                    const status = !response.ok ? `HTTP ${response.status}` : '';
                    throw new Error(header?.resultMsg || result?.message || `공공데이터포털 시세를 불러오지 못했습니다${status ? ` (${status})` : ''}.`);
                }
                const rawItems = result?.response?.body?.items?.item;
                const items = Array.isArray(rawItems) ? rawItems : rawItems ? [rawItems] : [];
                return items.find(item => String(item.srtnCd || '').replace(/\D/g, '').endsWith(stockCode)) || null;
            } catch (error) {
                if (error.name === 'AbortError') throw new Error('국내 시세 요청 시간이 초과되었습니다.');
                throw error;
            } finally {
                clearTimeout(timeout);
            }
        };

        const fetchKoreanStockValuation = async (holding, apiKeys = {}) => {
            const stockCode = getKoreanStockCode(holding.symbol);
            const quantity = Number(holding.quantity || 0);
            if (!stockCode) throw new Error('국내 종목 코드는 6자리 숫자 또는 005930:KRX 형식으로 입력해주세요.');
            if (!Number.isFinite(quantity) || quantity <= 0) throw new Error('수량을 0보다 크게 입력해주세요.');
            const sources = [
                ['국내 주식', 'GetStockSecuritiesInfoService_V2', 'getStockPriceInfo_V2', typeof apiKeys === 'string' ? apiKeys : apiKeys.stock],
                ['국내 ETF', 'GetSecuritiesProductInfoService_V2', 'getETFPriceInfo_V2', typeof apiKeys === 'string' ? apiKeys : apiKeys.etf]
            ];
            const sourceErrors = [];
            for (const [sourceLabel, serviceName, operation, apiKey] of sources) {
                if (!apiKey) {
                    sourceErrors.push(`${sourceLabel}: API 키가 필요합니다.`);
                    continue;
                }
                try {
                    const item = await fetchPublicDataMarketItem(serviceName, operation, stockCode, apiKey);
                    if (!item) continue;
                    const previousClose = Number(String(item.clpr || '').replace(/,/g, ''));
                    if (!Number.isFinite(previousClose) || previousClose <= 0) continue;
                    const rawDate = String(item.basDt || '');
                    const priceDate = rawDate.length === 8 ? `${rawDate.slice(0, 4)}-${rawDate.slice(4, 6)}-${rawDate.slice(6, 8)}` : rawDate;
                    const marketSuffix = String(item.mrktCtg || '').toUpperCase() === 'KOSDAQ' ? 'KOSDAQ' : 'KRX';
                    return {
                        ...holding,
                        symbol: `${stockCode}:${marketSuffix}`,
                        quantity,
                        currency: 'KRW',
                        previousClose,
                        exchangeRate: 1,
                        priceDate,
                        quoteUpdatedAt: new Date().toISOString(),
                        priceProvider: 'data.go.kr',
                        stockName: item.itmsNm || holding.stockName || ''
                    };
                } catch (error) {
                    sourceErrors.push(`${sourceLabel}: ${error.message}`);
                }
            }
            if (sourceErrors.length > 0) throw new Error(`${sourceErrors.join(' / ')} · API 활용신청과 서비스키를 확인해주세요.`);
            throw new Error('국내 종목을 찾을 수 없습니다. 종목 코드를 확인해주세요.');
        };

        const fetchStockHoldingValuation = async (holding, apiKey, exchangeRateCache = null, koreaApiKeys = {}) => {
            const symbol = String(holding.symbol || '').trim().toUpperCase();
            const quantity = Number(holding.quantity || 0);
            if (!symbol) throw new Error('종목 코드를 입력해주세요.');
            if (!Number.isFinite(quantity) || quantity <= 0) throw new Error('수량을 0보다 크게 입력해주세요.');
            if (getKoreanStockCode(symbol)) return fetchKoreanStockValuation({ ...holding, symbol, quantity }, koreaApiKeys);
            const quote = await fetchTwelveDataJson('quote', { symbol }, apiKey);
            const previousClose = Number(quote.previous_close);
            if (!Number.isFinite(previousClose) || previousClose <= 0) throw new Error('전일 종가를 확인할 수 없습니다. 종목 코드를 확인해주세요.');
            const currency = String(quote.currency || holding.currency || 'KRW').toUpperCase();
            let exchangeRate = 1;
            if (currency !== 'KRW') {
                if (exchangeRateCache?.has(currency)) {
                    exchangeRate = exchangeRateCache.get(currency);
                } else {
                    const exchange = await fetchTwelveDataJson('exchange_rate', { symbol: `${currency}/KRW` }, apiKey);
                    exchangeRate = Number(exchange.rate);
                    if (!Number.isFinite(exchangeRate) || exchangeRate <= 0) throw new Error(`${currency}/KRW 환율을 확인할 수 없습니다.`);
                    if (exchangeRateCache) exchangeRateCache.set(currency, exchangeRate);
                }
            }
            return {
                ...holding,
                symbol,
                quantity,
                currency,
                previousClose,
                exchangeRate,
                priceDate: quote.datetime ? String(quote.datetime).substring(0, 10) : '',
                quoteUpdatedAt: new Date().toISOString(),
                priceProvider: 'twelve-data'
            };
        };

        const refreshStockAssetQuotes = async (data, apiKey, force = false, koreaApiKeys = {}) => {
            const stockAssets = data.assets.filter(asset => asset.type === 'Stock' && getStockHoldings(asset).some(holding => holding.symbol && Number(holding.quantity || 0) > 0));
            if (stockAssets.length === 0) return { newData: data, stockAssetCount: 0, refreshedCount: 0, failures: [], changed: false, hasTargets: false };
            const hasTargets = stockAssets.some(asset => getStockHoldings(asset).some(holding => {
                const updatedAt = new Date(holding.quoteUpdatedAt || '').getTime();
                return force || !Number.isFinite(updatedAt) || Date.now() - updatedAt >= STOCK_QUOTE_MAX_AGE_MS;
            }));
            if (!hasTargets) return { newData: data, stockAssetCount: stockAssets.length, refreshedCount: 0, failures: [], changed: false, hasTargets: false };

            const updates = new Map();
            const failures = [];
            const exchangeRateCache = new Map();
            let refreshedCount = 0;
            for (const asset of stockAssets) {
                const holdings = getStockHoldings(asset);
                const refreshedHoldings = [];
                let assetChanged = !Array.isArray(asset.stockHoldings);
                for (const holding of holdings) {
                    const updatedAt = new Date(holding.quoteUpdatedAt || '').getTime();
                    const shouldRefresh = force || !Number.isFinite(updatedAt) || Date.now() - updatedAt >= STOCK_QUOTE_MAX_AGE_MS;
                    if (!shouldRefresh) {
                        refreshedHoldings.push(holding);
                        continue;
                    }
                    try {
                        refreshedHoldings.push(await fetchStockHoldingValuation(holding, apiKey, exchangeRateCache, koreaApiKeys));
                        refreshedCount += 1;
                        assetChanged = true;
                    } catch (error) {
                        refreshedHoldings.push(holding);
                        failures.push(`${asset.name} · ${holding.symbol}: ${error.message}`);
                    }
                }
                if (assetChanged) updates.set(asset.id, { ...asset, ...getStockAssetValuationFields(refreshedHoldings) });
            }
            const newData = updates.size > 0
                ? { ...data, assets: data.assets.map(asset => updates.get(asset.id) || asset) }
                : data;
            return { newData, stockAssetCount: stockAssets.length, refreshedCount, failures, changed: updates.size > 0, hasTargets: true };
        };

        const isIosDevice = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isStandaloneApp = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        const supportsWebPush = () => window.isSecureContext && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && !!window.firebase?.messaging;

        const getMessagingWorkerRegistration = async firebaseConfig => {
            if (!firebaseConfig) throw new Error('Firebase 설정이 필요합니다.');

            if (requiredKeys.some(key => !firebaseConfig[key])) throw new Error('Firebase 설정에 messagingSenderId와 appId가 포함되어야 합니다.');
            const workerUrl = new URL('firebase-messaging-sw.js', window.location.href);

        const saveNotificationDevice = async (user, token) => {

            const existing = await reference.get();
            const now = new Date().toISOString();
            await reference.set({
                token,
                platform: getNotificationPlatform(),
                enabled: true,
                createdAt: existing.exists ? existing.data().createdAt || now : now,

        const registerNotificationDevice = async ({ firebaseConfig, user, vapidKey, requestPermission = false }) => {
            if (!supportsWebPush()) throw new Error('이 브라우저에서는 웹 푸시 알림을 지원하지 않습니다.');
            if (!user || !firebase.apps.length) throw new Error('Firebase에 로그인한 뒤 알림을 활성화해주세요.');
            if (!vapidKey?.trim()) throw new Error('VAPID 공개키를 입력해주세요.');
            if (isIosDevice() && !isStandaloneApp()) throw new Error('iPhone에서는 먼저 이 웹앱을 홈 화면에 추가해주세요.');
            let permission = Notification.permission;
            if (permission === 'default' && requestPermission) permission = await Notification.requestPermission();
            if (permission !== 'granted') throw new Error(permission === 'denied' ? '브라우저 설정에서 알림 권한이 차단되어 있습니다.' : '알림 권한을 허용해주세요.');
            const registration = await getMessagingWorkerRegistration(firebaseConfig);
            const messaging = firebase.messaging();

        const getAssetEvaluationDate = upToDate => upToDate || formatLocalDate(new Date());
        const isAssetActiveOn = (asset, upToDate) => !asset.startDate || asset.startDate <= getAssetEvaluationDate(upToDate);

        const calculateAssetDebt = (asset, transactions, upToDate) => {
            if (!isAssetActiveOn(asset, upToDate)) return 0;
            return Math.max(0, Number(asset.initialDebt || 0) - transactions.reduce((sum, transaction) => {
            if (upToDate && transaction.date > upToDate) return sum;
            if (asset.startDate && transaction.date < asset.startDate) return sum;
            return sum + (transaction.type === 'Expense' && transaction.loanAssetId === asset.id ? Number(transaction.loanPrincipal || 0) : 0);
            }, 0));
        };

        const calculateAssetBalance = (assetId, assets, transactions, upToDate, stockTransactions = []) => {
            const asset = assets.find(a => a.id === assetId);
            if (!asset) return 0;
            if (!isAssetActiveOn(asset, upToDate)) return 0;
            if (asset.type === 'RealEstate') return Number(asset.initialBalance || 0) - calculateAssetDebt(asset, transactions, upToDate);
            if (asset.type === 'Stock') {
                const holdings = getStockHoldings(asset);
                if (holdings.length > 0) return holdings.reduce((sum, holding) => {
                    const quantity = getStockHoldingQuantityAtDate(asset, holding, stockTransactions, upToDate);
                    return sum + getStockHoldingValue({ ...holding, quantity: Math.max(0, quantity) });
                }, 0);
            }
            const history = transactions.filter(t => {
                const match = t.assetId === assetId || t.toAssetId === assetId;
                const afterStart = !asset.startDate || t.date >= asset.startDate;
                if (upToDate) return match && afterStart && t.date <= upToDate;
                return match && afterStart;
            });
            return history.reduce((sum, t) => {
                const amt = Number(t.amount || 0);
                if (t.type === 'Income' && t.assetId === assetId) return sum + amt;
                if (t.type === 'Expense' && t.assetId === assetId) return sum - amt;
                if (t.type === 'Transfer') {
                    if (t.assetId === assetId) return sum - amt;
                    if (t.toAssetId === assetId) return sum + amt;
                }
                return sum;
            }, Number(asset.initialBalance || 0));
        };

        const formatLocalDate = date => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        const parseLocalDate = dateString => {
            const [year, month, day] = dateString.split('-').map(Number);
            return new Date(year, month - 1, day);
        };
        const addLocalDays = (date, days) => new Date(date.getFullYear(), date.getMonth(), date.getDate() + days);
        const koreanHolidayCache = new Map();

        const getKoreanHolidays = year => {
            if (koreanHolidayCache.has(year)) return koreanHolidayCache.get(year);
            const holidays = new Set();
            const substituteGroups = [];
            const addFixed = (month, day, substitute = false) => {
                const value = formatLocalDate(new Date(year, month - 1, day));
                holidays.add(value);
                if (substitute) substituteGroups.push([value]);
            };

            addFixed(1, 1);
            addFixed(3, 1, true);
            addFixed(5, 1); // 근로자의 날(금융 영업일 기준)
            addFixed(5, 5, true);
            addFixed(6, 6);
            addFixed(8, 15, true);
            addFixed(10, 3, true);
            addFixed(10, 9, true);
            addFixed(12, 25, year >= 2023);

            try {
                const lunarFormatter = new Intl.DateTimeFormat('en-u-ca-chinese', { month: 'numeric', day: 'numeric' });
                const lunarGroups = { seollal: [], buddha: [], chuseok: [] };
                for (let date = new Date(year, 0, 1); date.getFullYear() === year; date = addLocalDays(date, 1)) {
                    const parts = lunarFormatter.formatToParts(date);
                    const month = Number(parts.find(part => part.type === 'month')?.value);
                    const day = Number(parts.find(part => part.type === 'day')?.value);
                    const value = formatLocalDate(date);
                    if ((month === 12 && day >= 29) || (month === 1 && day <= 2)) lunarGroups.seollal.push(value);
                    if (month === 4 && day === 8) lunarGroups.buddha.push(value);
                    if (month === 8 && day >= 14 && day <= 16) lunarGroups.chuseok.push(value);
                }
                Object.values(lunarGroups).forEach(group => group.forEach(value => holidays.add(value)));
                if (lunarGroups.seollal.length) substituteGroups.push(lunarGroups.seollal);
                if (lunarGroups.chuseok.length) substituteGroups.push(lunarGroups.chuseok);
                if (year >= 2023 && lunarGroups.buddha.length) substituteGroups.push(lunarGroups.buddha);
            } catch (error) {
                console.warn('음력 공휴일 계산을 지원하지 않는 브라우저입니다.', error);
            }

            substituteGroups.forEach(group => {
                const needsSubstitute = group.some(value => {
                    const day = parseLocalDate(value).getDay();
                    return day === 0 || day === 6;
                });
                if (!needsSubstitute) return;
                let substitute = addLocalDays(parseLocalDate(group[group.length - 1]), 1);
                while (substitute.getDay() === 0 || substitute.getDay() === 6 || holidays.has(formatLocalDate(substitute))) substitute = addLocalDays(substitute, 1);
                holidays.add(formatLocalDate(substitute));
            });

            koreanHolidayCache.set(year, holidays);
            return holidays;
        };

        const isBusinessDay = date => date.getDay() !== 0 && date.getDay() !== 6 && !getKoreanHolidays(date.getFullYear()).has(formatLocalDate(date));
        const adjustToBusinessDay = (dateString, direction) => {
            if (!direction) return dateString;
            let date = parseLocalDate(dateString);
            const step = direction === 'before' ? -1 : 1;
            while (!isBusinessDay(date)) date = addLocalDays(date, step);
            return formatLocalDate(date);
        };

        const addLocalMonths = (dateString, monthCount) => {
            const date = parseLocalDate(dateString);
            const targetMonth = date.getMonth() + Number(monthCount || 0);
            const lastDay = new Date(date.getFullYear(), targetMonth + 1, 0).getDate();
            return formatLocalDate(new Date(date.getFullYear(), targetMonth, Math.min(date.getDate(), lastDay)));
        };

        const getLoanInstallmentNumber = (loanStartDate, paymentDate) => {
            if (!loanStartDate || !paymentDate) return 0;
            const loanStart = parseLocalDate(loanStartDate);
            const payment = parseLocalDate(paymentDate);
            const monthDifference = (payment.getFullYear() - loanStart.getFullYear()) * 12 + payment.getMonth() - loanStart.getMonth();
            return monthDifference > 0 ? monthDifference : 0;
        };

        const calculateEqualPaymentInstallment = (principalValue, annualRateValue, termMonthsValue, installmentNumberValue) => {
            const principal = Number(principalValue || 0);
            const annualRate = Number(annualRateValue || 0);
            const termMonths = Math.floor(Number(termMonthsValue || 0));
            const installmentNumber = Math.floor(Number(installmentNumberValue || 0));
            if (principal <= 0 || annualRate < 0 || termMonths <= 0 || installmentNumber <= 0 || installmentNumber > termMonths) return null;

            const monthlyRate = annualRate / 100 / 12;
            const exactPayment = monthlyRate === 0
                ? principal / termMonths
                : principal * monthlyRate * Math.pow(1 + monthlyRate, termMonths) / (Math.pow(1 + monthlyRate, termMonths) - 1);
            const periodsBefore = installmentNumber - 1;
            const balanceBefore = monthlyRate === 0
                ? Math.max(0, principal - exactPayment * periodsBefore)
                : Math.max(0, principal * Math.pow(1 + monthlyRate, periodsBefore) - exactPayment * (Math.pow(1 + monthlyRate, periodsBefore) - 1) / monthlyRate);
            const interest = Math.max(0, Math.round(balanceBefore * monthlyRate));
            const principalPayment = installmentNumber === termMonths
                ? Math.max(0, Math.round(balanceBefore))
                : Math.max(0, Math.min(Math.round(balanceBefore), Math.round(exactPayment) - interest));

            return {
                installmentNumber,
                principal: principalPayment,
                interest,
                total: principalPayment + interest,
                remainingAfter: Math.max(0, Math.round(balanceBefore) - principalPayment)
            };
        };

        const getRecurringLoanInstallment = (recurring, paymentDate) => {
            if (!recurring?.isLoanPayment || !recurring.loanStartDate) return null;
            const installmentNumber = getLoanInstallmentNumber(recurring.loanStartDate, paymentDate);
            return calculateEqualPaymentInstallment(recurring.loanOriginalPrincipal, recurring.loanAnnualRate, recurring.loanTermMonths, installmentNumber);
        };

        const getRecurringOccurrences = (recurring, untilDate, maxOccurrences = 5000) => {
            if (!recurring.startDate) return [];
            const frequency = recurring.frequency || 'monthly';
            const start = parseLocalDate(recurring.startDate);
            const until = parseLocalDate(untilDate);
            const rawLimit = addLocalDays(until, 14);
            const occurrences = [];
            const addOccurrence = rawDate => {
                const rawDateString = formatLocalDate(rawDate);
                if (rawDateString < recurring.startDate || rawDate > rawLimit) return;
                const scheduledDate = adjustToBusinessDay(rawDateString, recurring.businessDayDirection || '');
                if (recurring.endDate && scheduledDate > recurring.endDate) return;
                const occurrenceKey = frequency === 'monthly' ? rawDateString.substring(0, 7) : rawDateString;
                occurrences.push({ rawDate: rawDateString, scheduledDate, occurrenceKey });
            };

            if (frequency === 'weekly') {
                const weekday = Number.isInteger(Number(recurring.weekday)) ? Number(recurring.weekday) : start.getDay();
                let cursor = addLocalDays(start, (weekday - start.getDay() + 7) % 7);
                while (cursor <= rawLimit && occurrences.length < maxOccurrences) {
                    addOccurrence(cursor);
                    cursor = addLocalDays(cursor, 7);
                }
            } else if (frequency === 'yearly') {
                const month = Math.min(Math.max(Number(recurring.month || start.getMonth() + 1), 1), 12);
                for (let year = start.getFullYear(); year <= rawLimit.getFullYear() && occurrences.length < maxOccurrences; year += 1) {
                    const lastDay = new Date(year, month, 0).getDate();
                    addOccurrence(new Date(year, month - 1, Math.min(Math.max(Number(recurring.day || start.getDate()), 1), lastDay)));
                }
            } else {
                let cursor = new Date(start.getFullYear(), start.getMonth(), 1);
                while (cursor <= rawLimit && occurrences.length < maxOccurrences) {
                    const lastDay = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();
                    const day = Math.min(Math.max(Number(recurring.day || start.getDate()), 1), lastDay);
                    addOccurrence(new Date(cursor.getFullYear(), cursor.getMonth(), day));
                    cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
                }
            }
            return occurrences;
        };

        const getNextRecurringDate = recurring => {
            if (recurring.active === false) return null;
            const todayString = formatLocalDate(new Date());
            const limit = new Date();
            limit.setFullYear(limit.getFullYear() + 5);
            return getRecurringOccurrences(recurring, formatLocalDate(limit)).find(occurrence => {
                if (occurrence.scheduledDate < todayString) return false;
                const hasEqualPaymentSchedule = recurring.isLoanPayment && recurring.loanOriginalPrincipal && recurring.loanStartDate && recurring.loanTermMonths;
                return !hasEqualPaymentSchedule || !!getRecurringLoanInstallment(recurring, occurrence.rawDate);
            })?.scheduledDate || null;
        };

        const useMobileEdgeSwipeBack = onBack => {
            const onBackRef = React.useRef(onBack);
            onBackRef.current = onBack;

            useEffect(() => {
                let gesture = null;
                const reset = () => { gesture = null; };
                const isMobile = () => window.matchMedia('(max-width: 768px)').matches;

                const handleTouchStart = event => {
                    if (!isMobile() || event.touches.length !== 1) return;
                    const touch = event.touches[0];
                    if (touch.clientX > 28) return;
                    const target = event.target;
                    if (target.closest?.('input, textarea, select, [contenteditable="true"], .budget-modal-overlay, .asset-modal-overlay, .transaction-modal-overlay')) return;
                    gesture = { startX: touch.clientX, startY: touch.clientY, x: touch.clientX, y: touch.clientY, startedAt: Date.now(), horizontal: false };
                };

                const handleTouchMove = event => {
                    if (!gesture || event.touches.length !== 1) return;
                    const touch = event.touches[0];
                    gesture.x = touch.clientX;
                    gesture.y = touch.clientY;
                    const deltaX = gesture.x - gesture.startX;
                    const deltaY = gesture.y - gesture.startY;
                    if (deltaX < -8 || (Math.abs(deltaY) > 14 && Math.abs(deltaY) > Math.abs(deltaX))) { reset(); return; }
                    if (deltaX > 12 && Math.abs(deltaX) > Math.abs(deltaY) * 1.15) {
                        gesture.horizontal = true;
                        event.preventDefault();
                    }
                };

                const handleTouchEnd = () => {
                    if (!gesture) return;
                    const deltaX = gesture.x - gesture.startX;
                    const deltaY = Math.abs(gesture.y - gesture.startY);
                    const elapsed = Date.now() - gesture.startedAt;
                    const shouldGoBack = gesture.horizontal && deltaX >= 72 && deltaY <= 64 && deltaX > deltaY * 1.25 && elapsed <= 900;
                    reset();
                    if (shouldGoBack) onBackRef.current?.();
                };

                document.addEventListener('touchstart', handleTouchStart, { passive: true });
                document.addEventListener('touchmove', handleTouchMove, { passive: false });
                document.addEventListener('touchend', handleTouchEnd, { passive: true });
                document.addEventListener('touchcancel', reset, { passive: true });
                return () => {
                    document.removeEventListener('touchstart', handleTouchStart);
                    document.removeEventListener('touchmove', handleTouchMove);
                    document.removeEventListener('touchend', handleTouchEnd);
                    document.removeEventListener('touchcancel', reset);
                };
            }, []);
        };

        // ApexCharts를 useRef + useEffect로 직접 렌더링하는 컴포넌트

                    legend: { show: series.length > 1, position: 'top', labels: { colors: '#57606a' } }

                if (chartRef.current) {
                    chartRef.current.updateOptions(options, true, true);
                    chartRef.current.updateSeries(series);

                }
                months.add(selectedMonth);
                return Array.from(months).sort((a, b) => b.localeCompare(a));
            }, [data.transactions, selectedMonth]);

            const filteredMonthTransactions = useMemo(() => data.transactions.filter(transaction => {
                if (!transaction.date.startsWith(selectedMonth)) return false;
                return authorFilter === 'ALL' || transaction.authorEmail === authorFilter;
            }), [data.transactions, selectedMonth, authorFilter]);

            const authorOptions = useMemo(() => Array.from(new Set(data.transactions.map(transaction => transaction.authorEmail).filter(Boolean))), [data.transactions]);
            const selectedAuthorLabel = authorFilter === 'ALL'
                ? '전체'
                : (data.authorAbbreviations || []).find(author => author.email === authorFilter)?.abbr || authorFilter.split('@')[0];

            useEffect(() => {
                if (!showMonthPicker) return;
                const previousOverflow = document.body.style.overflow;
                document.body.style.overflow = 'hidden';
                const frame = requestAnimationFrame(() => selectedMonthRef.current?.scrollIntoView({ block: 'center' }));
                return () => {
                    cancelAnimationFrame(frame);
                    document.body.style.overflow = previousOverflow;
                };
            }, [showMonthPicker]);

            const stats = useMemo(() => {
                const [year, month] = selectedMonth.split('-').map(Number);
                const currentMonthT = data.transactions.filter(t => t.date.startsWith(selectedMonth));

                // Identify savings categories
                const savingsCategories = data.categories.filter(c => c.name === '저축' || c.name.includes('저축')).map(c => c.id);

                const income = currentMonthT.filter(t => t.type === 'Income').reduce((s, t) => s + Number(t.amount), 0);
                const rawExpense = currentMonthT.filter(t => t.type === 'Expense').reduce((s, t) => s + Number(t.amount), 0);
                const savings = currentMonthT.filter(t => (t.type === 'Expense' || t.type === 'Transfer') && savingsCategories.includes(t.categoryId)).reduce((s, t) => s + Math.abs(Number(t.amount)), 0);
                const expense = rawExpense - currentMonthT.filter(t => t.type === 'Expense' && savingsCategories.includes(t.categoryId)).reduce((s, t) => s + Number(t.amount), 0);

                // Previous month stats
                const prevDate = new Date(year, month - 2, 1);
                const prevMonthStr = `${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`;
                const prevMonthT = data.transactions.filter(t => t.date.startsWith(prevMonthStr));
                const prevIncome = prevMonthT.filter(t => t.type === 'Income').reduce((s, t) => s + Number(t.amount), 0);
                const prevRawExpense = prevMonthT.filter(t => t.type === 'Expense').reduce((s, t) => s + Number(t.amount), 0);
                const prevSavings = prevMonthT.filter(t => (t.type === 'Expense' || t.type === 'Transfer') && savingsCategories.includes(t.categoryId)).reduce((s, t) => s + Math.abs(Number(t.amount)), 0);
                const prevExpense = prevRawExpense - prevMonthT.filter(t => t.type === 'Expense' && savingsCategories.includes(t.categoryId)).reduce((s, t) => s + Number(t.amount), 0);

                // Assets up to selected month
                const totalAssets = data.assets.reduce((sum, asset) => sum + calculateAssetBalance(asset.id, data.assets, data.transactions, `${selectedMonth}-31`, data.stockTransactions), 0);

                return { income, expense, savings, totalAssets, prevIncome, prevExpense };
            }, [selectedMonth, data.transactions, data.assets]);

            const annualData = useMemo(() => {
                const [year, month] = selectedMonth.split('-').map(Number);
                const labels = Array.from({ length: 12 }, (_, i) => {
                    const d = new Date(year, month - 1 - (11 - i), 1);
                    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                });
                const incomeData = labels.map(m => data.transactions.filter(t => t.date.startsWith(m) && t.type === 'Income').reduce((s, t) => s + Number(t.amount), 0));

                const savingsCategories = data.categories.filter(c => c.name === '저축' || c.name.includes('저축')).map(c => c.id);

                const savingsData = labels.map(m => data.transactions.filter(t => t.date.startsWith(m) && (t.type === 'Expense' || t.type === 'Transfer') && savingsCategories.includes(t.categoryId)).reduce((s, t) => s + Math.abs(Number(t.amount)), 0));

                const expenseData = labels.map(m => {
                    const rawExp = data.transactions.filter(t => t.date.startsWith(m) && t.type === 'Expense').reduce((s, t) => s + Number(t.amount), 0);
                    const sav = data.transactions.filter(t => t.date.startsWith(m) && t.type === 'Expense' && savingsCategories.includes(t.categoryId)).reduce((s, t) => s + Number(t.amount), 0);
                    return rawExp - sav;
                });

                const assetData = labels.map(m => {
                    return data.assets.reduce((sum, asset) => sum + calculateAssetBalance(asset.id, data.assets, data.transactions, `${m}-31`, data.stockTransactions), 0);
                });

                return { labels: labels.map(m => `${m.substring(5)}월`), incomeData, expenseData, savingsData, assetData };
            }, [selectedMonth, data.transactions, data.assets]);

            const annualCategoryData = useMemo(() => {
                const [year, month] = selectedMonth.split('-').map(Number);
                const labels = Array.from({ length: 12 }, (_, i) => {
                    const d = new Date(year, month - 1 - (11 - i), 1);
                    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                });
                const categoryData = labels.map(m => {
                    return data.transactions
                        .filter(t => t.date.startsWith(m) && t.categoryId === selectedCategory)
                        .reduce((s, t) => s + Math.abs(Number(t.amount)), 0);
                });
                return { labels: labels.map(m => `${m.substring(5)}월`), categoryData };
            }, [selectedMonth, selectedCategory, data.transactions]);

            const fullAssetFlowData = useMemo(() => {
                const today = formatLocalDate(new Date());
                const endMonth = today.substring(0, 7);
                const startedAssetMonths = data.assets
                    .map(asset => asset.startDate?.substring(0, 7))
                    .filter(month => month && month <= endMonth)
                    .sort();
                const transactionMonths = data.transactions
                    .map(transaction => transaction.date?.substring(0, 7))
                    .filter(Boolean)
                    .sort();
                const defaultStartMonth = startedAssetMonths.length > 0
                    ? startedAssetMonths[startedAssetMonths.length - 1]
                    : transactionMonths[0] || endMonth;
                const startMonth = assetFlowRange.startMonth || defaultStartMonth;
                const selectedEndMonth = assetFlowRange.endMonth || endMonth;
                const [startYear, startMonthNumber] = startMonth.split('-').map(Number);
                const [endYear, endMonthNumber] = selectedEndMonth.split('-').map(Number);
                const monthCount = Math.max(1, (endYear - startYear) * 12 + endMonthNumber - startMonthNumber + 1);
                const months = Array.from({ length: monthCount }, (_, index) => {
                    const date = new Date(startYear, startMonthNumber - 1 + index, 1);
                    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                });
                const assetData = months.map(month => data.assets.reduce((sum, asset) => sum + calculateAssetBalance(asset.id, data.assets, data.transactions, `${month}-31`, data.stockTransactions), 0));
                const yearlyPoints = months.reduce((points, month, index) => {
                    const year = month.substring(0, 4);
                    points.set(year, assetData[index]);
                    return points;
                }, new Map());
                return {
                    startMonth,
                    endMonth: selectedEndMonth,
                    defaultStartMonth,
                    defaultEndMonth: endMonth,
                    labels: months.map(month => `${month.substring(0, 4)}.${Number(month.substring(5))}`),
                    assetData,
                    yearlyLabels: Array.from(yearlyPoints.keys()).map(year => `${year}년`),
                    yearlyAssetData: Array.from(yearlyPoints.values())
                };
            }, [data.assets, data.transactions, assetFlowRange]);



            const renderDiff = (curr, prev) => {
                const diff = curr - prev;
                const icon = diff >= 0 ? 'trending-up' : 'trending-down';
                const color = diff >= 0 ? 'var(--income-color)' : 'var(--expense-color)';
                return (
                    <div style={{ fontSize: '0.75rem', color, display: 'flex', alignItems: 'center', gap: '3px', marginTop: '6px', opacity: 0.85 }}>
                        <Icon name={icon} size={12} /> {Math.abs(diff).toLocaleString()} {diff >= 0 ? '▲' : '▼'} 전월 대비
                    </div>
                );
            };

            if (view === 'income_detail' || view === 'expense_detail' || view === 'savings_detail') {
                const type = view === 'income_detail' ? 'Income' : 'Expense';
                const savingsCategories = data.categories.filter(c => c.name === '저축' || c.name.includes('저축')).map(c => c.id);

                // 이번달 거래
                const monthT = data.transactions.filter(t => {
                    if (!t.date.startsWith(selectedMonth)) return false;
                    if (view === 'savings_detail') return (t.type === 'Expense' || t.type === 'Transfer') && savingsCategories.includes(t.categoryId);
                    if (view === 'expense_detail') return t.type === 'Expense' && !savingsCategories.includes(t.categoryId);
                    return t.type === type;
                });

                // 전월 계산
                const [selYear, selMon] = selectedMonth.split('-').map(Number);
                const prevDate = new Date(selYear, selMon - 2, 1);
                const prevMonth = `${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`;
                const prevMonthT = data.transactions.filter(t => {
                    if (!t.date.startsWith(prevMonth)) return false;
                    if (view === 'savings_detail') return (t.type === 'Expense' || t.type === 'Transfer') && savingsCategories.includes(t.categoryId);
                    if (view === 'expense_detail') return t.type === 'Expense' && !savingsCategories.includes(t.categoryId);
                    return t.type === type;
                });

                const catGrouped = data.categories.filter(c => {
                    if (view === 'savings_detail') return savingsCategories.includes(c.id);
                    if (view === 'expense_detail') return c.type === 'Expense' && !savingsCategories.includes(c.id);
                    return c.type === type;
                }).map(c => ({
                    ...c,
                    amount: monthT.filter(t => t.categoryId === c.id).reduce((s, t) => s + Number(t.amount), 0),
                    prevAmount: prevMonthT.filter(t => t.categoryId === c.id).reduce((s, t) => s + Number(t.amount), 0)
                })).filter(c => c.amount > 0).sort((a, b) => b.amount - a.amount);

                return (
                    <div className="fade-in">
                        <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '1.5rem' }}>
                            <button onClick={() => setView('main')} className="icon-btn"><Icon name="arrow-left" /></button>
                            <h1 className="detail-title">{selectedMonth} {view === 'income_detail' ? '수입' : view === 'expense_detail' ? '지출' : '저축'} 카테고리별</h1>
                        </div>
                        <div className="card">
                            {catGrouped.map(c => {
                                const diff = c.amount - c.prevAmount;
                                const hasPrev = c.prevAmount > 0;
                                return (
                                    <div key={c.id} className="list-item" onClick={() => { setSelectedId(c.id); setView('category_list'); }} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '1rem', borderBottom: '1px solid #30363d', cursor: 'pointer' }}>
                                        <span>{c.name}</span>
                                        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: '2px' }}>
                                            <span style={{ fontWeight: 600 }}>{c.amount.toLocaleString()}원 <Icon name="chevron-right" size={14} /></span>
                                            {hasPrev && (
                                                <span style={{ fontSize: '0.78rem', color: diff > 0 ? 'var(--expense-color)' : diff < 0 ? 'var(--income-color)' : 'var(--text-secondary)' }}>
                                                    {diff > 0 ? '▲' : diff < 0 ? '▼' : '─'} {Math.abs(diff).toLocaleString()}원 전월대비
                                                </span>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                            {catGrouped.length === 0 && <div style={{ padding: '2rem', textAlign: 'center' }}>데이터가 없습니다.</div>}
                        </div>
                    </div>
                );
            }

            if (view === 'category_list') {
                const category = data.categories.find(c => c.id === selectedId);
                const list = data.transactions.filter(t => t.date.startsWith(selectedMonth) && t.categoryId === selectedId).sort((a, b) => b.date.localeCompare(a.date));
                const savingsCategories = data.categories.filter(c => c.name === '저축' || c.name.includes('저축')).map(c => c.id);
                const backView = category.type === 'Income' ? 'income_detail' : savingsCategories.includes(category.id) ? 'savings_detail' : 'expense_detail';
                return (
                    <div className="fade-in">
                        <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '1.5rem' }}>
                            <button onClick={() => setView(backView)} className="icon-btn"><Icon name="arrow-left" /></button>
                            <h1 className="detail-title">{selectedMonth} {category.name} 내역</h1>
                        </div>
                        <div className="card" style={{ padding: 0 }}>
                            <table className="transaction-table">
                                <thead><tr><th>날짜</th><th>금액</th><th className="mobile-hide">자산</th><th>메모</th></tr></thead>
                                <tbody>
                                    {list.map(t => (
                                        <tr key={t.id} onClick={() => { setEdit(t); setShowModal(true); }} style={{ cursor: 'pointer' }} className="list-item">
                                            <td>{t.date.substring(8)}일</td>
                                            <td style={{ fontWeight: 600 }}>{Number(t.amount).toLocaleString()}</td>
                                            <td className="mobile-hide">{data.assets.find(a => a.id === t.assetId)?.name}</td>
                                            <td>{t.memo}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            }

            if (view === 'asset_detail') {
                const upToDate = `${selectedMonth}-31`;
                const groupGrouped = sortGroupsByPriority(data.groups).map(g => {
                    const assets = data.assets.filter(a => a.groupId === g.id);
                    const total = assets.reduce((sum, a) => sum + calculateAssetBalance(a.id, data.assets, data.transactions, upToDate, data.stockTransactions), 0);
                    return { ...g, total, assets };
                }).filter(g => g.total !== 0 || g.assets.length > 0);

                return (
                    <div className="fade-in">
                        <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '1.5rem' }}>
                            <button onClick={() => setView('main')} className="icon-btn"><Icon name="arrow-left" /></button>
                            <h1 className="detail-title">자산 현황 ({selectedMonth.split('-')[0]}년 {selectedMonth.split('-')[1]}월 말 기준)</h1>
                        </div>
                        <div className="card">
                            {groupGrouped.map(g => (
                                <div key={g.id} style={{ marginBottom: '1.5rem' }}>
                                    <h3 style={{ borderBottom: '1px solid #30363d', paddingBottom: '0.5rem', marginBottom: '0.5rem', display: 'flex', justifyContent: 'space-between' }}>
                                        {g.name} <span>{g.total.toLocaleString()}원</span>
                                    </h3>
                                    {g.assets.map(a => {
                                        const bal = calculateAssetBalance(a.id, data.assets, data.transactions, upToDate, data.stockTransactions);
                                        return (
                                            <div key={a.id} onClick={() => { setEditAsset(a); setShowAssetModal(true); }} style={{ display: 'flex', justifyContent: 'space-between', paddingLeft: '1rem', paddingBottom: '0.3rem', color: '#8b949e', cursor: 'pointer' }} className="list-item">
                                                <span>{a.name}</span>
                                                <span>{bal.toLocaleString()}원</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            if (view === 'asset_flow_detail') {
                const firstValue = fullAssetFlowData.assetData[0] || 0;
                const latestValue = fullAssetFlowData.assetData[fullAssetFlowData.assetData.length - 1] || 0;
                const chronologicalLabels = assetFlowPeriod === 'yearly' ? fullAssetFlowData.yearlyLabels : fullAssetFlowData.labels;
                const chronologicalValues = assetFlowPeriod === 'yearly' ? fullAssetFlowData.yearlyAssetData : fullAssetFlowData.assetData;
                const flowLabels = [...chronologicalLabels].reverse();
                const flowValues = [...chronologicalValues].reverse();
                const flowChartHeight = Math.max(360, flowLabels.length * 38 + 70);
                const openAssetFlowRangePicker = () => {
                    setAssetFlowRangeDraft({ startMonth: fullAssetFlowData.startMonth, endMonth: fullAssetFlowData.endMonth });
                    setShowAssetFlowRangePicker(true);
                };
                const applyAssetFlowRange = () => {
                    if (!assetFlowRangeDraft.startMonth || !assetFlowRangeDraft.endMonth) {
                        alert('시작 월과 종료 월을 모두 선택해주세요.');
                        return;
                    }
                    if (assetFlowRangeDraft.startMonth > assetFlowRangeDraft.endMonth) {
                        alert('시작 월은 종료 월보다 늦을 수 없습니다.');
                        return;
                    }
                    setAssetFlowRange(assetFlowRangeDraft);
                    setShowAssetFlowRangePicker(false);
                };
                return (
                    <div className="fade-in page-shell dashboard-page dashboard-asset-flow-page">
                        <div className="dashboard-detail-toolbar">
                            <button className="transaction-round-button" onClick={() => setView('main')} aria-label="대시보드로 돌아가기"><Icon name="chevron-left" size={20} /></button>
                            <strong>전체 자산 흐름</strong>
                            <span />
                        </div>
                        <div className="dashboard-flow-period-tabs" role="tablist" aria-label="자산 흐름 조회 단위">
                            <button type="button" role="tab" aria-selected={assetFlowPeriod === 'monthly'} className={assetFlowPeriod === 'monthly' ? 'active' : ''} onClick={() => setAssetFlowPeriod('monthly')}>월별</button>
                            <button type="button" role="tab" aria-selected={assetFlowPeriod === 'yearly'} className={assetFlowPeriod === 'yearly' ? 'active' : ''} onClick={() => setAssetFlowPeriod('yearly')}>연도별</button>
                        </div>
                        <section className="dashboard-flow-summary">
                            <button type="button" className="dashboard-flow-range-button" onClick={openAssetFlowRangePicker} aria-haspopup="dialog" aria-expanded={showAssetFlowRangePicker}>
                                <span><small>조회 기간</small><strong>{fullAssetFlowData.startMonth.replace('-', '년 ')}월 ~ {fullAssetFlowData.endMonth.replace('-', '년 ')}월</strong></span>
                                <Icon name="chevron-down" size={18} />
                            </button>
                            <div><small>기간 증감</small><strong className={latestValue - firstValue < 0 ? 'negative' : ''}>{latestValue - firstValue >= 0 ? '+' : ''}{(latestValue - firstValue).toLocaleString()}원</strong></div>
                        </section>
                        {showAssetFlowRangePicker && (
                            <div className="month-picker-overlay" role="presentation" onClick={() => setShowAssetFlowRangePicker(false)}>
                                <section className="month-picker-sheet dashboard-range-picker-sheet" role="dialog" aria-modal="true" aria-labelledby="asset-flow-range-title" onClick={event => event.stopPropagation()}>
                                    <header>
                                        <button onClick={() => setShowAssetFlowRangePicker(false)} aria-label="기간 선택 닫기"><Icon name="x" size={27} /></button>
                                        <strong id="asset-flow-range-title">조회 기간 선택</strong>
                                        <span />
                                    </header>
                                    <div className="dashboard-range-picker-form">
                                        <label><span>시작 월</span><input type="month" value={assetFlowRangeDraft.startMonth} max={assetFlowRangeDraft.endMonth || fullAssetFlowData.defaultEndMonth} onChange={event => setAssetFlowRangeDraft(current => ({ ...current, startMonth: event.target.value }))} /></label>
                                        <label><span>종료 월</span><input type="month" value={assetFlowRangeDraft.endMonth} min={assetFlowRangeDraft.startMonth} max={fullAssetFlowData.defaultEndMonth} onChange={event => setAssetFlowRangeDraft(current => ({ ...current, endMonth: event.target.value }))} /></label>
                                        <div className="dashboard-range-picker-actions">
                                            <button type="button" onClick={() => { setAssetFlowRange({ startMonth: '', endMonth: '' }); setShowAssetFlowRangePicker(false); }}>기본 기간</button>
                                            <button type="button" className="primary" onClick={applyAssetFlowRange}>적용</button>
                                        </div>
                                    </div>
                                </section>
                            </div>
                        )}
                        <section className="dashboard-chart-card dashboard-full-flow-card">
                            <div className="dashboard-chart-heading">
                                <span><Icon name="landmark" size={18} /></span>
                                <h3>{assetFlowPeriod === 'yearly' ? '연도별' : '월별'} 전체 자산</h3>
                            </div>
                            <div className="dashboard-full-flow-scroll">
                                <div>
                                    <ChartBar
                                        chartId={`chart-assets-full-${assetFlowPeriod}`}
                                        series={[{ name: '자산액', data: flowValues }]}
                                        colors={['#0969da']}
                                        labels={flowLabels}
                                        height={flowChartHeight}
                                        horizontal={true}
                                    />
                                </div>
                            </div>
                            <p className="dashboard-flow-note">{assetFlowPeriod === 'yearly' ? '각 연도의 마지막 조회 월 자산액을 표시합니다. 현재 연도는 현재 월 기준입니다.' : '시작일자가 설정된 자산 중 가장 늦은 시작 월부터 현재까지 표시합니다.'}</p>
                        </section>
                    </div>
                );
            }

            const dashboardIncome = filteredMonthTransactions.filter(transaction => transaction.type === 'Income').reduce((sum, transaction) => sum + Number(transaction.amount || 0), 0);
            const dashboardExpense = filteredMonthTransactions.filter(transaction => transaction.type === 'Expense').reduce((sum, transaction) => sum + Number(transaction.amount || 0), 0);
            const dashboardBalance = dashboardIncome - dashboardExpense;

            return (
                <div className="fade-in page-shell dashboard-page">
                    <section className="transaction-calendar-card dashboard-calendar-card">
                        <div className="transaction-toolbar dashboard-toolbar">
                            <button className="transaction-round-button dashboard-back-button" onClick={() => setTab('home')} aria-label="홈으로 돌아가기"><Icon name="chevron-left" size={20} /></button>
                            <button className="transaction-month-control" onClick={() => setShowMonthPicker(true)} aria-haspopup="dialog" aria-expanded={showMonthPicker}>
                                <strong>{selectedMonth.split('-')[0]}년 {Number(selectedMonth.split('-')[1])}월</strong>
                            </button>
                            <div className="dashboard-author-filter">
                                <Icon name="user-round" size={16} />
                                <small>{selectedAuthorLabel}</small>
                                <select value={authorFilter} onChange={event => setAuthorFilter(event.target.value)} aria-label="작성자 필터">
                                    <option value="ALL">전체</option>
                                    {authorOptions.map(email => {
                                        const found = (data.authorAbbreviations || []).find(author => author.email === email);
                                        return <option key={email} value={email}>{found ? found.abbr : email}</option>;
                                    })}
                                </select>
                            </div>
                        </div>
                    </section>

                    {showMonthPicker && (
                        <div className="month-picker-overlay" role="presentation" onClick={() => setShowMonthPicker(false)}>
                            <section className="month-picker-sheet" role="dialog" aria-modal="true" aria-labelledby="dashboard-month-picker-title" onClick={event => event.stopPropagation()}>
                                <header>
                                    <button onClick={() => setShowMonthPicker(false)} aria-label="월 선택 닫기"><Icon name="x" size={27} /></button>
                                    <strong id="dashboard-month-picker-title">월 선택</strong>
                                    <span />
                                </header>
                                <div className="month-picker-list">
                                    {availableMonths.map(month => (
                                        <button key={month} ref={month === selectedMonth ? selectedMonthRef : null} className={month === selectedMonth ? 'selected' : ''} onClick={() => {
                                            setSelectedMonth(month);
                                            setShowMonthPicker(false);
                                        }}>
                                            <span>{month.split('-')[0]}년 {Number(month.split('-')[1])}월</span>
                                            {month === selectedMonth && <Icon name="check" size={22} />}
                                        </button>
                                    ))}
                                </div>
                            </section>
                        </div>

                    <section className={`dashboard-balance-card ${dashboardBalance < 0 ? 'negative' : 'positive'}`}>
