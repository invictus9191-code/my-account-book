                                        <h3>자산 목록 및 관리</h3>
                                        <button className="primary" onClick={() => { setEditingAsset(null); setShowAssetModal(true); }}>+ 자산 추가</button>
                                    </div>
                                    <div className="settings-assets-table-wrap">
                                        <table className="settings-assets-table">
                                            <thead><tr><th>자산명</th><th>우선순위</th><th>소유자</th><th>그룹</th><th>유형</th><th>시작일자</th><th>초기금액</th><th>현재금액</th><th>관리</th></tr></thead>
                                            <tbody>
                                                {data.assets.slice().sort((a, b) => Number(a.priority || 9999) - Number(b.priority || 9999)).map(a => {
                                                    const bal = calculateAssetBalance(a.id, data.assets, data.transactions, undefined, data.stockTransactions);
                                                    return (
                                                        <tr key={a.id}>
                                                            <td data-label="자산명" className="settings-asset-name-cell">
                                                                <strong>{a.name}</strong>
                                                                <span className="settings-asset-mobile-meta">{getAssetTypeLabel(a.type, data)} · {data.groups?.find(g => g.id === a.groupId)?.name || '미지정'} · {data.owners.find(o => o.id === a.ownerId)?.name || '소유자 미지정'}</span>
                                                                <span className="settings-asset-mobile-meta">{a.startDate || '시작일 미설정'} · 우선순위 {a.priority !== undefined && a.priority !== 9999 ? a.priority : '-'} · 초기 {Number(a.initialBalance || 0).toLocaleString()}원</span>
                                                            </td>
                                                            <td data-label="우선순위" className="settings-asset-desktop-detail">{a.priority !== undefined && a.priority !== 9999 ? a.priority : '-'}</td>
                                                            <td data-label="소유자" className="settings-asset-desktop-detail">{data.owners.find(o => o.id === a.ownerId)?.name}</td>
                                                            <td data-label="그룹" className="settings-asset-desktop-detail">{data.groups?.find(g => g.id === a.groupId)?.name || '-'}</td>
                                                            <td data-label="유형" className="settings-asset-desktop-detail">{getAssetTypeLabel(a.type, data)}</td>
                                                            <td data-label="시작일자" className="settings-asset-desktop-detail">{a.startDate || '-'}</td>
                                                            <td data-label="초기금액" className="settings-asset-desktop-detail" style={{ color: '#8b949e' }}>{Number(a.initialBalance || 0).toLocaleString()}</td>
                                                            <td data-label="현재금액" className="settings-asset-current-balance" style={{ fontWeight: 600, color: '#58a6ff' }}>{bal.toLocaleString()}원</td>
                                                            <td data-label="관리" className="settings-asset-manage-cell">
                                                                <button onClick={() => { setEditingAsset(a); setShowAssetModal(true); }} style={{ background: 'transparent', color: '#58a6ff', padding: '0.3rem' }}>수정</button>
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                                {data.assets.length === 0 && <tr><td colSpan="9" style={{ textAlign: 'center', padding: '2rem' }}>등록된 자산이 없습니다.</td></tr>}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    {showAssetModal && <AssetModal data={data} setData={setData} onClose={() => setShowAssetModal(false)} editItem={editingAsset} syncToCloud={syncToCloud} />}
                </div>
            );
        }

        function App() {
            const [data, setData] = useState(() => {
                const s = localStorage.getItem(STORAGE_KEY);
                if (!s) return initialData;
                const p = JSON.parse(s);
                if (!p.categories || p.categories.length < 10) p.categories = initialData.categories;
                if (!p.groups) p.groups = initialData.groups;
                p.groups = p.groups.map((group, index) => ({
                    ...group,
                    priority: getGroupPriority(group, index)
                }));
                if (!p.budgets) p.budgets = [];
                if (!p.stockTransactions) p.stockTransactions = [];
                if (!p.recurringTransactions) p.recurringTransactions = [];
                if (!p.shoppingItems) p.shoppingItems = [];
                if (!p.shoppingFavorites) p.shoppingFavorites = [];
                if (!p.assetTypes) p.assetTypes = [];
                if (!p.assetTypeLabels) p.assetTypeLabels = {};
                if (!p.marketDataApiKey) p.marketDataApiKey = '';
                if (!p.koreaMarketApiKey) p.koreaMarketApiKey = '';
                if (!p.koreaStockApiKey) p.koreaStockApiKey = p.koreaMarketApiKey || '';
                if (!p.koreaEtfApiKey) p.koreaEtfApiKey = p.koreaMarketApiKey || '';
                if (p.assets) p.assets = p.assets.map(a => ({
                    ...a,
                    initialBalance: a.initialBalance !== undefined ? a.initialBalance : 0,
                    groupId: a.groupId || '',
                    startDate: a.startDate || ''
                }));
                return p;
            });
            const [user, setUser] = useState(null);
            const [fbConfig, setFbConfig] = useState(() => JSON.parse(localStorage.getItem(FIREBASE_CONFIG_KEY) || 'null'));
            const [tab, setTab] = useState('home');
            const [hideAssetAmounts, setHideAssetAmounts] = useState(() => localStorage.getItem(ASSET_AMOUNT_HIDDEN_KEY) === 'true');
            const [transactionBackTab, setTransactionBackTab] = useState('home');
            const [showModal, setShowModal] = useState(false);
            const [edit, setEdit] = useState(null);
            
            const [authorFilter, setAuthorFilter] = useState('ALL');

            // For Dashboard Asset editing
            const [showAssetModal, setShowAssetModal] = useState(false);
            const [editAsset, setEditAsset] = useState(null);

            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [transactionMonth, setTransactionMonth] = useState(null); // 대시보드 카테고리 상세보기 시 월 필터
            const [showMobileSearch, setShowMobileSearch] = useState(false);
            const [recurringCheckDate, setRecurringCheckDate] = useState(() => formatLocalDate(new Date()));

            const isConnected = useMemo(() => {
                return !!user && !!fbConfig && window.firebase && firebase.apps.length > 0;
            }, [user, fbConfig]);

            useEffect(() => {
                if (!('serviceWorker' in navigator) || !window.isSecureContext) return;
                const workerUrl = new URL('firebase-messaging-sw.js', window.location.href);
                if (fbConfig) {
                    ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'].forEach(key => {
                        if (fbConfig[key]) workerUrl.searchParams.set(key, fbConfig[key]);
                    });
                }
                navigator.serviceWorker.register(workerUrl.href, { scope: './' }).catch(error => console.warn('Service worker registration failed:', error));
            }, [fbConfig]);

            const syncToCloud = (newData) => {
                if (user && window.firebase && firebase.apps.length) {
                    const sharedId = localStorage.getItem(SHARED_ID_KEY);
                    const docRef = sharedId 
                        ? firebase.firestore().collection('shared_data').doc(sharedId) 
                        : firebase.firestore().collection('users').doc(user.uid);
                    docRef.set(newData).catch(err => console.error("Firebase Sync Error:", err));
                }
            };

            useEffect(() => {
                const timer = setInterval(() => {
                    const currentDate = formatLocalDate(new Date());
                    setRecurringCheckDate(previous => previous === currentDate ? previous : currentDate);
                }, 60000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                const recurringItems = (data.recurringTransactions || []).filter(item => item.active !== false);
                if (recurringItems.length === 0) return;
                const today = recurringCheckDate;
                const existingIds = new Set(data.transactions.map(transaction => transaction.id));
                const generated = [];

                recurringItems.forEach(item => {
                    if (!item.startDate) return;
                    getRecurringOccurrences(item, today).forEach(occurrence => {
                        const transactionId = `recurring-${item.id}-${occurrence.occurrenceKey}`;
                        if (occurrence.scheduledDate <= today && !existingIds.has(transactionId)) {
                            const hasEqualPaymentSchedule = item.isLoanPayment && item.loanOriginalPrincipal && item.loanStartDate && item.loanTermMonths;
                            const loanInstallment = hasEqualPaymentSchedule ? getRecurringLoanInstallment(item, occurrence.rawDate) : null;
                            if (hasEqualPaymentSchedule && !loanInstallment) return;
                            generated.push({
                                id: transactionId,
                                recurringId: item.id,
                                recurringMonth: occurrence.rawDate.substring(0, 7),
                                recurringOccurrence: occurrence.rawDate,
                                type: item.type,
                                amount: item.isLoanPayment && loanInstallment ? loanInstallment.total : Number(item.amount || 0),
                                date: occurrence.scheduledDate,
                                assetId: item.assetId,
                                toAssetId: item.type === 'Transfer' ? item.toAssetId : undefined,
                                categoryId: item.categoryId,
                                memo: item.name,
                                authorEmail: item.authorEmail || '',
                                isLoanPayment: !!item.isLoanPayment,
                                loanAssetId: item.isLoanPayment ? item.loanAssetId : '',
                                loanPrincipal: item.isLoanPayment ? Number(loanInstallment?.principal ?? item.loanPrincipal ?? 0) : 0,
                                loanInterest: item.isLoanPayment ? Number(loanInstallment?.interest ?? item.loanInterest ?? 0) : 0,
                                loanInstallmentNumber: loanInstallment?.installmentNumber || null
                            });
                            existingIds.add(transactionId);
                        }
                    });
                });

                if (generated.length > 0) {
                    const newData = { ...data, transactions: [...data.transactions, ...generated] };
                    setData(newData);
                    syncToCloud(newData);
                }
            }, [data.recurringTransactions, data.transactions, recurringCheckDate]);

            useEffect(() => {
                if (!fbConfig || !window.firebase) return;
                if (!firebase.apps.length) firebase.initializeApp(fbConfig);
                
                let unsubSnapshot = null;
                const unsubscribeAuth = firebase.auth().onAuthStateChanged(u => {
                    setUser(u);
                    if (unsubSnapshot) { unsubSnapshot(); unsubSnapshot = null; }
                    
                    if (u) {
                        const sharedId = localStorage.getItem(SHARED_ID_KEY);
                        const docRef = sharedId 
                            ? firebase.firestore().collection('shared_data').doc(sharedId) 
                            : firebase.firestore().collection('users').doc(u.uid);
                        
                        unsubSnapshot = docRef.onSnapshot(d => {
                            if (!d.exists) {
                                // 클라우드에 데이터가 없으면 최초 1회 로컬 데이터를 업로드
                                const currentLocalData = JSON.parse(localStorage.getItem(STORAGE_KEY) || JSON.stringify(initialData));
                                const legacyMarketApiKey = localStorage.getItem(TWELVE_DATA_API_KEY) || '';
                                const legacyKoreaMarketApiKey = localStorage.getItem(KOREA_MARKET_API_KEY) || '';
                                const localKoreaStockApiKey = localStorage.getItem(KOREA_STOCK_API_KEY) || legacyKoreaMarketApiKey;
                                const localKoreaEtfApiKey = localStorage.getItem(KOREA_ETF_API_KEY) || legacyKoreaMarketApiKey;
                                const initialCloudData = {
                                    ...currentLocalData,
                                    ...(legacyMarketApiKey ? { marketDataApiKey: legacyMarketApiKey } : {}),
                                    ...(legacyKoreaMarketApiKey ? { koreaMarketApiKey: legacyKoreaMarketApiKey } : {}),
                                    ...(localKoreaStockApiKey ? { koreaStockApiKey: localKoreaStockApiKey } : {}),
                                    ...(localKoreaEtfApiKey ? { koreaEtfApiKey: localKoreaEtfApiKey } : {})
                                };
                                docRef.set(initialCloudData).then(() => {
                                    if (legacyMarketApiKey) localStorage.removeItem(TWELVE_DATA_API_KEY);
                                    if (legacyKoreaMarketApiKey) localStorage.removeItem(KOREA_MARKET_API_KEY);
                                    if (localKoreaStockApiKey) localStorage.removeItem(KOREA_STOCK_API_KEY);
                                    if (localKoreaEtfApiKey) localStorage.removeItem(KOREA_ETF_API_KEY);
                                }).catch(err => console.error("Initial Sync Fail:", err));
                                setData(initialCloudData);
                            } else {
                                let cloudData = d.data();
                                const legacyMarketApiKey = localStorage.getItem(TWELVE_DATA_API_KEY) || '';
                                const legacyKoreaMarketApiKey = localStorage.getItem(KOREA_MARKET_API_KEY) || '';
                                const localKoreaStockApiKey = localStorage.getItem(KOREA_STOCK_API_KEY) || '';
                                const localKoreaEtfApiKey = localStorage.getItem(KOREA_ETF_API_KEY) || '';
                                const migratedKeys = {};
                                if (!cloudData.marketDataApiKey && legacyMarketApiKey) migratedKeys.marketDataApiKey = legacyMarketApiKey;
                                if (!cloudData.koreaMarketApiKey && legacyKoreaMarketApiKey) migratedKeys.koreaMarketApiKey = legacyKoreaMarketApiKey;
                                if (!cloudData.koreaStockApiKey && localKoreaStockApiKey) migratedKeys.koreaStockApiKey = localKoreaStockApiKey;
                                if (!cloudData.koreaEtfApiKey && localKoreaEtfApiKey) migratedKeys.koreaEtfApiKey = localKoreaEtfApiKey;
                                if (Object.keys(migratedKeys).length > 0) {
                                    cloudData = { ...cloudData, ...migratedKeys };
                                    docRef.set(migratedKeys, { merge: true }).then(() => {
                                        if (migratedKeys.marketDataApiKey) localStorage.removeItem(TWELVE_DATA_API_KEY);
                                        if (migratedKeys.koreaMarketApiKey) localStorage.removeItem(KOREA_MARKET_API_KEY);
                                        if (migratedKeys.koreaStockApiKey) localStorage.removeItem(KOREA_STOCK_API_KEY);
                                        if (migratedKeys.koreaEtfApiKey) localStorage.removeItem(KOREA_ETF_API_KEY);
                                    }).catch(err => console.error("Market API Key Migration Fail:", err));
                                }
                                if (cloudData.marketDataApiKey && legacyMarketApiKey && !migratedKeys.marketDataApiKey) localStorage.removeItem(TWELVE_DATA_API_KEY);
                                if (cloudData.koreaMarketApiKey && legacyKoreaMarketApiKey && !migratedKeys.koreaMarketApiKey) localStorage.removeItem(KOREA_MARKET_API_KEY);
                                if (cloudData.koreaStockApiKey && localKoreaStockApiKey && !migratedKeys.koreaStockApiKey) localStorage.removeItem(KOREA_STOCK_API_KEY);
                                if (cloudData.koreaEtfApiKey && localKoreaEtfApiKey && !migratedKeys.koreaEtfApiKey) localStorage.removeItem(KOREA_ETF_API_KEY);
                                // 클라우드 데이터를 기준으로 상태 업데이트 (Source of Truth)
                                setData(prev => {
                                    if (JSON.stringify(prev) !== JSON.stringify(cloudData)) {
                                        return cloudData;
                                    }
                                    return prev;
                                });
                            }
                        }, err => {
                            console.error("Firebase Snapshot Error:", err);
                            if (err.code === 'permission-denied') {
                                alert("Firebase 권한 오류: Firestore 보안 규칙을 확인해주세요.");
                            } else {
                                alert("Firebase 연동 오류: " + err.message);
                            }
                        });
                    }
                });

                return () => {
                    unsubscribeAuth();
                    if (unsubSnapshot) unsubSnapshot();
                };
            }, [fbConfig]);

            useEffect(() => {
                if (!user || !fbConfig || !isConnected || localStorage.getItem(NOTIFICATION_ENABLED_KEY) !== 'true') return;
                if (!supportsWebPush() || Notification.permission !== 'granted') return;
                const vapidKey = localStorage.getItem(NOTIFICATION_VAPID_KEY) || '';
                if (!vapidKey) return;
                let cancelled = false;
                let unsubscribeMessage = null;

                registerNotificationDevice({ firebaseConfig: fbConfig, user, vapidKey, requestPermission: false })
                    .then(() => {
                        if (cancelled) return;
                        unsubscribeMessage = firebase.messaging().onMessage(async payload => {
                            const notification = payload.notification || payload.data || {};
                            const registration = await navigator.serviceWorker.ready;
                            await registration.showNotification(notification.title || 'Smart Finance', {
                                body: notification.body || '새로운 알림이 도착했습니다.',
                                icon: notification.icon || './assets/icon-192.png',
                                badge: './assets/icon-192.png',
                                tag: payload.data?.tag || 'smart-finance-foreground',
                                data: { url: payload.data?.url || './' }
                            });
                        });
                    })
                    .catch(error => console.warn('Push registration refresh failed:', error));

                return () => {
                    cancelled = true;
                    if (unsubscribeMessage) unsubscribeMessage();
                };
            }, [user, fbConfig, isConnected]);

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                if (window.lucide) window.lucide.createIcons();
            }, [data]);

            useEffect(() => {
                localStorage.setItem(ASSET_AMOUNT_HIDDEN_KEY, String(hideAssetAmounts));
            }, [hideAssetAmounts]);

            useEffect(() => {
                if (tab !== 'transactions') setTransactionBackTab(tab);
            }, [tab]);

            useEffect(() => {
                const isHome = tab === 'home';
                document.documentElement.classList.toggle('home-active', isHome);
                document.body.classList.toggle('home-active', isHome);
                return () => {
                    document.documentElement.classList.remove('home-active');
                    document.body.classList.remove('home-active');
                };
            }, [tab]);

            const menuClick = (t) => {
                if (t === 'settings') {
                    const pw = prompt('설정 페이지에 진입하려면 비밀번호를 입력하세요.');
                    const storedPw = localStorage.getItem(PASSWORD_KEY) || DEFAULT_PASSWORD;
                    if (pw !== storedPw) { alert('비밀번호가 올바르지 않습니다.'); return; }
                }
                setTab(t);
                setSidebarOpen(false);
            };

            const handleSignOut = async () => {
                await unregisterNotificationDevice(user);
                await firebase.auth().signOut();
            };

            const tabTitles = {
                home: '홈',
                dashboard: '대시보드',
                plan: '계획',
                recurring: '반복',
                shopping: '장바구니',
                transactions: '거래 내역',
                assets: '자산 현황',
                settings: '설정'
            };

            return (
                <React.Fragment>
                    <div className={`mobile-header ${tab === 'home' ? 'home-mobile-header' : ''} ${tab === 'dashboard' ? 'dashboard-mobile-header' : ''} ${tab === 'plan' ? 'plan-mobile-header' : ''} ${tab === 'recurring' ? 'recurring-mobile-header' : ''} ${tab === 'shopping' ? 'shopping-mobile-header' : ''} ${tab === 'transactions' ? 'transactions-mobile-header' : ''} ${tab === 'assets' ? 'assets-mobile-header' : ''}`}>
                        <button onClick={() => setSidebarOpen(true)} style={{ background: 'transparent', color: 'var(--text-primary)', padding: '0.4rem' }}><Icon name="menu" size={24} /></button>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '8px', flex: 1 }}>
                            <Icon name={tab === 'home' ? 'home' : tab === 'dashboard' ? 'layout-dashboard' : tab === 'plan' ? 'target' : tab === 'recurring' ? 'repeat' : tab === 'shopping' ? 'shopping-basket' : tab === 'transactions' ? 'list' : tab === 'assets' ? 'wallet' : 'settings'} size={24} className="mobile-hide" />
                            <h2 style={{ fontSize: '1.2rem' }}>{tabTitles[tab] || 'Smart Finance'}</h2>
                            <div className={`connection-status ${isConnected ? 'connected' : 'disconnected'}`} style={{ marginLeft: 'auto' }}>
                                <div className="connection-dot"></div>
                                <span className="mobile-hide">{isConnected ? '연동됨' : '미연동'}</span>
                            </div>
                        </div>
                    </div>
                    <div className={`mobile-overlay ${sidebarOpen ? 'visible' : ''}`} onClick={() => setSidebarOpen(false)}></div>
                    <div className={`sidebar ${sidebarOpen ? 'mobile-open' : ''}`}>
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '1.5rem' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}><Icon name="activity" size={24} /><h2>Smart Finance</h2></div>
                            <button className="mobile-only" onClick={() => setSidebarOpen(false)} style={{ background: 'transparent', color: 'var(--text-primary)', display: window.innerWidth <= 768 ? 'block' : 'none' }}><Icon name="x" size={24} /></button>
                        </div>
                        <div style={{ marginBottom: '1rem', padding: '0 0.5rem' }}>
                            <div className={`connection-status ${isConnected ? 'connected' : 'disconnected'}`}>
                                <div className="connection-dot"></div>
                                <span>{isConnected ? 'Firebase 클라우드 연동 중' : '서버 연결 안 됨 (작성 제한됨)'}</span>
                            </div>
                        </div>
                        <div className={`nav-item ${tab === 'home' ? 'active' : ''}`} onClick={() => menuClick('home')}><Icon name="home" /> 홈</div>
                        <div className={`nav-item ${tab === 'dashboard' ? 'active' : ''}`} onClick={() => menuClick('dashboard')}><Icon name="layout-dashboard" /> 대시보드</div>
                        <div className={`nav-item ${tab === 'transactions' ? 'active' : ''}`} onClick={() => menuClick('transactions')}><Icon name="list" /> 거래 내역</div>
                        <div className={`nav-item ${tab === 'assets' ? 'active' : ''}`} onClick={() => menuClick('assets')}><Icon name="wallet" /> 자산 현황</div>
                        <div className={`nav-item ${tab === 'shopping' ? 'active' : ''}`} onClick={() => menuClick('shopping')}><Icon name="shopping-basket" /> 장바구니</div>
                        <div className={`nav-item ${tab === 'settings' ? 'active' : ''}`} onClick={() => menuClick('settings')}><Icon name="settings" /> 설정</div>
                        <div className="user-profile">{user ? <button onClick={handleSignOut} className="auth-btn" style={{ background: 'transparent', color: '#8b949e' }}><Icon name="log-out" size={16} /> 로그아웃</button> : <button className="auth-btn login" onClick={() => { if (!fbConfig) setTab('settings'); else firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()); }}><Icon name="log-in" size={16} /> 로그인</button>}</div>
                    </div>
                    <div className={`main-content ${tab === 'home' ? 'home-content' : ''} ${tab === 'dashboard' ? 'dashboard-content' : ''}`}><div className="container">
                        {tab === 'home' && <HomePage data={data} setTab={setTab} setEdit={setEdit} setShowModal={setShowModal} isConnected={isConnected} onNavigate={menuClick} hideAssetAmounts={hideAssetAmounts} setHideAssetAmounts={setHideAssetAmounts} />}
                        {tab === 'dashboard' && <Dashboard data={data} setEdit={setEdit} setShowModal={setShowModal} setEditAsset={setEditAsset} setShowAssetModal={setShowAssetModal} setTab={setTab} setSearchTerm={setSearchTerm} setTransactionMonth={setTransactionMonth} authorFilter={authorFilter} setAuthorFilter={setAuthorFilter} />}
                        {tab === 'plan' && <PlanPage data={data} setData={setData} syncToCloud={syncToCloud} setTab={setTab} />}
                        {tab === 'recurring' && <RecurringPage data={data} setData={setData} syncToCloud={syncToCloud} setTab={setTab} user={user} isConnected={isConnected} />}
                        {tab === 'shopping' && <ShoppingPage data={data} setData={setData} syncToCloud={syncToCloud} setTab={setTab} isConnected={isConnected} />}
                        {tab === 'transactions' && <TransactionPage data={data} setData={setData} setEdit={setEdit} setShowModal={setShowModal} syncToCloud={syncToCloud} searchTerm={searchTerm} setSearchTerm={setSearchTerm} isConnected={isConnected} authorFilter={authorFilter} setAuthorFilter={setAuthorFilter} transactionMonth={transactionMonth} setTransactionMonth={setTransactionMonth} setTab={setTab} backTab={transactionBackTab} showMobileSearch={showMobileSearch} setShowMobileSearch={setShowMobileSearch} />}
                        {tab === 'assets' && <AssetManagementPage data={data} setData={setData} syncToCloud={syncToCloud} setEdit={setEdit} setShowModal={setShowModal} setTab={setTab} setSearchTerm={setSearchTerm} setEditAsset={setEditAsset} setShowAssetModal={setShowAssetModal} hideAssetAmounts={hideAssetAmounts} />}
                        {tab === 'settings' && <Settings data={data} setData={setData} fbConfig={fbConfig} setFbConfig={setFbConfig} syncToCloud={syncToCloud} user={user} isConnected={isConnected} setTab={setTab} />}
                    </div></div>
                    {showModal && <TransactionModal data={data} setData={setData} onClose={() => { setShowModal(false); setEdit(null); }} editItem={edit} syncToCloud={syncToCloud} isConnected={isConnected} user={user} />}
                    {showAssetModal && <AssetModal data={data} setData={setData} onClose={() => { setShowAssetModal(false); setEditAsset(null); }} editItem={editAsset} syncToCloud={syncToCloud} />}
                </React.Fragment>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
