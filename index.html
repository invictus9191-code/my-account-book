                                setShowStockTransactions(true);
                            }} aria-label="주식 거래내역"><Icon name="trending-up" size={22} /></button>
                            <button className="asset-new-button" onClick={() => { setEditAsset(null); setShowAssetModal(true); }} aria-label="신규 자산 추가">
                                <Icon name="wallet" size={23} />
                                <span><Icon name="plus" size={10} /></span>
                            </button>
                        </div>
                    </div>
                    <div className="asset-total-card">
                        <div className="asset-total-summary">
                            <div>
                                <div className="asset-total-label">전체 자산 합계</div>
                                <div className="asset-total-amount">{hideAssetAmounts ? '금액숨김' : `${grandTotal.toLocaleString()}원`}</div>
                                {grandDebt > 0 && <small className="asset-total-debt">{hideAssetAmounts ? '금액숨김' : `부채 ${grandDebt.toLocaleString()}원`}</small>}
                            </div>
                            <span className="asset-total-icon"><Icon name="wallet" size={24} /></span>
                        </div>
                        {allocationGroups.length > 0 && (
                            <div className="asset-allocation">
                                <div className="asset-allocation-bar" role="img" aria-label={`${assetViewMode === 'type' ? '자산 유형별' : '자산 그룹별'} 비중`}>
                                    {allocationGroups.map((group, index) => (
                                        <span key={group.id} style={{ width: `${getAllocationPercent(group)}%`, background: allocationColors[index % allocationColors.length] }} title={`${group.name} ${getAllocationPercent(group).toFixed(1)}%`} />
                                    ))}
                                </div>
                                <div className="asset-allocation-legend">
                                    {allocationGroups.map((group, index) => (
                                        <span key={group.id}><i style={{ background: allocationColors[index % allocationColors.length] }} />{group.name} {getAllocationPercent(group).toFixed(1)}%</span>
                                    ))}
                                </div>
                            </div>
                        )}
                        {data.assets.some(asset => asset.type === 'Stock') && (
                            <div className="asset-stock-sync">
                                <span>{stockRefreshState.message || '주식은 전일 종가와 원화 환율 기준입니다.'}</span>
                            </div>
                        )}
                    </div>
                    <div className="card">
                        {displayedGroups.map(g => {
                            const groupDebt = g.assets.reduce((sum, asset) => sum + calculateAssetDebt(asset, data.transactions), 0);
                            return <div key={g.id} style={{ marginBottom: '2rem' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', paddingBottom: '0.8rem', borderBottom: '2px solid #30363d', marginBottom: '1rem' }}>
                                    <h3 style={{ color: '#58a6ff' }}>
                                        {g.name}
                                        {assetViewMode === 'type' && <small className="asset-type-percentage">{`${getAllocationPercent(g).toFixed(1)}%`}</small>}
                                    </h3>
                                    <span className="asset-amount-stack"><b>{hideAssetAmounts ? '금액숨김' : `${g.total.toLocaleString()}원`}</b>{groupDebt > 0 && <small>{hideAssetAmounts ? '금액숨김' : `부채 ${groupDebt.toLocaleString()}원`}</small>}</span>
                                </div>
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                                    {g.assets.map(a => {
                                        const bal = calculateAssetBalance(a.id, data.assets, data.transactions, undefined, data.stockTransactions);
                                        const debt = calculateAssetDebt(a, data.transactions);
                                        return (
                                            <div key={a.id} onClick={() => { setSearchTerm(a.name); setTab('transactions'); }} style={{ display: 'flex', justifyContent: 'space-between', padding: '0.5rem 1rem', background: 'rgba(9, 105, 218, 0.1)', borderRadius: '6px', cursor: 'pointer', transition: 'background 0.15s' }} className="list-item">
                                                <span className="asset-list-copy">
                                                    <span>{a.name}<Icon name="chevron-right" size={14} style={{ color: '#58a6ff', opacity: 0.7 }} /></span>
                                                </span>
                                                <span className="asset-amount-stack"><b>{hideAssetAmounts ? '금액숨김' : `${bal.toLocaleString()}원`}</b>{a.type === 'RealEstate' && debt > 0 && <small>{hideAssetAmounts ? '금액숨김' : `부채 ${debt.toLocaleString()}원`}</small>}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>;
                        })}
                        {displayedGroups.length === 0 && <div style={{ padding: '2rem', textAlign: 'center', color: '#8b949e' }}>등록된 자산이 없습니다. 설정에서 자산을 추가해주세요.</div>}
                    </div>
                </div>
            );
        }

        function StockTransactionPage({ data, setData, syncToCloud, onBack, hideAssetAmounts }) {
            const stockAssets = data.assets.filter(asset => asset.type === 'Stock');
            const [showForm, setShowForm] = useState(false);
            const [dateRange, setDateRange] = useState({ start: '', end: '' });
            const [form, setForm] = useState({ assetId: stockAssets[0]?.id || '', type: 'Buy', date: formatLocalDate(new Date()), symbol: '', quantity: '', unitPrice: '', memo: '' });
            const [state, setState] = useState({ loading: false, message: '' });
            const allTransactions = (data.stockTransactions || []).slice().sort((a, b) => b.date.localeCompare(a.date) || String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
            const transactions = allTransactions.filter(transaction => {
                if (dateRange.start && transaction.date < dateRange.start) return false;
                if (dateRange.end && transaction.date > dateRange.end) return false;
                return true;
            });
            const isDateRangeActive = Boolean(dateRange.start || dateRange.end);

            const resetForm = () => {
                setForm({ assetId: stockAssets[0]?.id || '', type: 'Buy', date: formatLocalDate(new Date()), symbol: '', quantity: '', unitPrice: '', memo: '' });
                setState({ loading: false, message: '' });
            };

            const closeForm = () => { setShowForm(false); resetForm(); };

            const handleSubmit = async event => {
                event.preventDefault();
                const targetAsset = data.assets.find(asset => asset.id === form.assetId && asset.type === 'Stock');
                const symbol = String(form.symbol || '').trim().toUpperCase();
                const symbolKey = getStockSymbolKey(symbol);
                const quantity = Number(form.quantity || 0);
                const unitPrice = Number(form.unitPrice || 0);
                if (!targetAsset || !form.date || !symbolKey || !Number.isFinite(quantity) || quantity <= 0) {
                    setState({ loading: false, message: '자산, 거래일, 종목 코드와 수량을 확인해주세요.' });
                    return;
                }

                const holdings = getStockHoldings(targetAsset);
                const holdingIndex = holdings.findIndex(holding => getStockSymbolKey(holding.symbol) === symbolKey);
                const existingHolding = holdingIndex >= 0 ? holdings[holdingIndex] : null;
                const currentQuantity = Number(existingHolding?.quantity || 0);
                if (form.type === 'Sell' && (!existingHolding || currentQuantity < quantity)) {
                    setState({ loading: false, message: `매도 가능 수량은 ${currentQuantity.toLocaleString()}주입니다.` });
                    return;
                }

                setState({ loading: true, message: form.type === 'Buy' && !existingHolding ? '종목 시세를 확인하고 있습니다.' : '거래를 저장하고 있습니다.' });
                let nextHolding = existingHolding ? { ...existingHolding } : createStockHolding({ symbol, quantity: 0 });
                if (nextHolding.ledgerBaseQuantity === undefined) nextHolding.ledgerBaseQuantity = currentQuantity;

                if (form.type === 'Buy' && !existingHolding) {
                    const apiKey = data.marketDataApiKey || localStorage.getItem(TWELVE_DATA_API_KEY) || '';
                    const koreaApiKeys = getKoreaMarketApiKeys(data);
                    try {
                        nextHolding = await fetchStockHoldingValuation(createStockHolding({ symbol, quantity: 0.000001 }), apiKey, new Map(), koreaApiKeys);
                        nextHolding.quantity = 0;
                        nextHolding.ledgerBaseQuantity = 0;
                    } catch (_) {
                        nextHolding = createStockHolding({
                            symbol: getKoreanStockCode(symbol) ? `${getKoreanStockCode(symbol)}:KRX` : symbol,
                            quantity: 0,
                            previousClose: unitPrice > 0 ? unitPrice : '',
                            currency: getKoreanStockCode(symbol) ? 'KRW' : '',
                            exchangeRate: 1,
                            ledgerBaseQuantity: 0
                        });
                    }
                }

                if (existingHolding && !nextHolding.stockName && getKoreanStockCode(symbol)) {
                    try {
                        const quoteHolding = await fetchStockHoldingValuation(
                            createStockHolding({ symbol, quantity: 0.000001 }),
                            data.marketDataApiKey || localStorage.getItem(TWELVE_DATA_API_KEY) || '',
                            new Map(),
                            getKoreaMarketApiKeys(data)
                        );
                        nextHolding = {
                            ...nextHolding,
                            stockName: quoteHolding.stockName || '',
                            previousClose: quoteHolding.previousClose,
                            currency: quoteHolding.currency,
                            exchangeRate: quoteHolding.exchangeRate,
                            priceDate: quoteHolding.priceDate,
                            quoteUpdatedAt: quoteHolding.quoteUpdatedAt,
                            priceProvider: quoteHolding.priceProvider
                        };
                    } catch (_) {}
                }

                nextHolding.quantity = currentQuantity + (form.type === 'Sell' ? -quantity : quantity);
                const nextHoldings = [...holdings];
                if (holdingIndex >= 0) nextHoldings[holdingIndex] = nextHolding;
                else nextHoldings.push(nextHolding);
                const transaction = {
                    id: `stock-tx-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
                    assetId: targetAsset.id,
                    type: form.type,
                    date: form.date,
                    symbol: nextHolding.symbol || symbol,
                    stockName: nextHolding.stockName || '',
                    quantity,
                    unitPrice: Number.isFinite(unitPrice) && unitPrice > 0 ? unitPrice : 0,
                    memo: form.memo.trim(),
                    createdAt: new Date().toISOString()
                };
                const updatedAsset = {
                    ...targetAsset,
                    startDate: !targetAsset.startDate || form.date < targetAsset.startDate ? form.date : targetAsset.startDate,
                    ...getStockAssetValuationFields(nextHoldings)
                };
                const newData = {
                    ...data,
                    stockTransactions: [...(data.stockTransactions || []), transaction],
                    assets: data.assets.map(asset => asset.id === targetAsset.id ? updatedAsset : asset)
                };
                setData(newData);
                syncToCloud(newData);
                closeForm();
            };

            const deleteTransaction = transaction => {
                if (!confirm(`${transaction.symbol} ${transaction.type === 'Sell' ? '매도' : '매수'} 내역을 삭제하시겠습니까?`)) return;
                const targetAsset = data.assets.find(asset => asset.id === transaction.assetId && asset.type === 'Stock');
                if (!targetAsset) return;
                const remainingTransactions = (data.stockTransactions || []).filter(item => item.id !== transaction.id);
                const holdings = getStockHoldings(targetAsset);
                const holdingIndex = holdings.findIndex(holding => getStockSymbolKey(holding.symbol) === getStockSymbolKey(transaction.symbol));
                if (holdingIndex < 0) return;
                const holding = holdings[holdingIndex];
                const recalculatedQuantity = getStockHoldingQuantityAtDate(targetAsset, holding, remainingTransactions);
                if (recalculatedQuantity < 0) {
                    alert('이 매수 내역을 삭제하면 보유 수량이 음수가 됩니다. 이후 매도 내역을 먼저 삭제해주세요.');
                    return;
                }
                const nextHoldings = holdings.map((item, index) => index === holdingIndex ? { ...item, quantity: recalculatedQuantity } : item);
                const updatedAsset = { ...targetAsset, ...getStockAssetValuationFields(nextHoldings) };
                const newData = {
                    ...data,
                    stockTransactions: remainingTransactions,
                    assets: data.assets.map(asset => asset.id === targetAsset.id ? updatedAsset : asset)
                };
                setData(newData);
                syncToCloud(newData);
            };

            return (
                <div className="asset-page stock-transaction-page fade-in">
                    <div className="stock-transaction-toolbar">
                        <button className="asset-back-button" onClick={onBack} aria-label="자산으로 돌아가기"><Icon name="chevron-left" size={21} /></button>
                        <strong>주식</strong>
                        <span className="stock-transaction-count">{transactions.length}건</span>
                    </div>
                    <section className="stock-holdings-summary">
                        {stockAssets.flatMap(asset => getStockHoldings(asset).filter(holding => Number(holding.quantity || 0) > 0).map(holding => (
                            <div className="stock-holdings-summary-row" key={`${asset.id}-${holding.id}`}>
                                <span><strong>{holding.stockName || holding.symbol}</strong><small>{holding.stockName ? `${holding.symbol} · ${asset.name}` : asset.name}</small></span>
                                <span className="stock-holdings-summary-value">
                                    <b>{Number(holding.quantity || 0).toLocaleString()}주</b>
                                    <small>{hideAssetAmounts ? '금액숨김' : `${getStockHoldingValue(holding).toLocaleString()}원`}</small>
                                </span>
                            </div>
                        )))}
                        {stockAssets.every(asset => getStockHoldings(asset).every(holding => Number(holding.quantity || 0) <= 0)) && <div className="stock-transaction-empty">매수 내역을 등록하면 보유 종목이 표시됩니다.</div>}
                    </section>
                    <h1 className="stock-transaction-section-title">거래내역</h1>
                    <div className="stock-transaction-date-range">
                        <label><span>시작일</span><input type="date" value={dateRange.start} max={dateRange.end || undefined} onChange={event => setDateRange(current => ({ ...current, start: event.target.value }))} /></label>
                        <span className="stock-transaction-date-separator">~</span>
                        <label><span>종료일</span><input type="date" value={dateRange.end} min={dateRange.start || undefined} onChange={event => setDateRange(current => ({ ...current, end: event.target.value }))} /></label>
                        {isDateRangeActive && <button type="button" onClick={() => setDateRange({ start: '', end: '' })} aria-label="주식 거래 기간 초기화"><Icon name="x" size={16} /></button>}
                    </div>
                    <section className="stock-transaction-list">
                        {transactions.map(transaction => {
                            const asset = data.assets.find(item => item.id === transaction.assetId);
                            const holding = asset ? getStockHoldings(asset).find(item => getStockSymbolKey(item.symbol) === getStockSymbolKey(transaction.symbol)) : null;
                            const stockName = transaction.stockName || holding?.stockName || '';
                            const total = Number(transaction.quantity || 0) * Number(transaction.unitPrice || 0);
                            return <article className="stock-transaction-card" key={transaction.id}>
                                <div className="stock-transaction-card-top">
                                    <span className={`stock-transaction-type ${transaction.type.toLowerCase()}`}>{transaction.type === 'Sell' ? '매도' : '매수'}</span>
                                    <time>{transaction.date}</time>
                                    <button type="button" onClick={() => deleteTransaction(transaction)} aria-label="거래 삭제"><Icon name="trash-2" size={17} /></button>
                                </div>
                                <div className="stock-transaction-card-main">
                                    <span><strong>{stockName || transaction.symbol}</strong><small>{stockName ? `${transaction.symbol} · ` : ''}{asset?.name || '삭제된 자산'}{transaction.memo ? ` · ${transaction.memo}` : ''}</small></span>
                                    <span><b>{Number(transaction.quantity || 0).toLocaleString()}주</b>{transaction.unitPrice > 0 && <small>{hideAssetAmounts ? '금액숨김' : `${Number(transaction.unitPrice).toLocaleString()}원 · ${total.toLocaleString()}원`}</small>}</span>
                                </div>
                            </article>;
                        })}
                        {transactions.length === 0 && <div className="stock-transaction-empty"><Icon name="trending-up" size={28} /><strong>주식 거래내역이 없습니다</strong><span>{isDateRangeActive ? '선택한 기간에 해당하는 거래가 없습니다.' : '매수·매도를 기록하면 보유 수량이 자동으로 계산됩니다.'}</span></div>}
                    </section>
                    <button className="transaction-add-button stock-transaction-add-button" onClick={() => setShowForm(true)} aria-label="주식 거래 추가"><Icon name="plus" size={27} /></button>
                    {showForm && <div className="asset-modal-overlay">
                        <div className="asset-modal-panel stock-holding-modal-panel">
                            <header className="asset-modal-header">
                                <button type="button" onClick={closeForm} aria-label="닫기"><Icon name="x" size={27} /></button>
                                <h2>주식 거래 추가</h2>
                                <button type="submit" form="stock-transaction-form" className="asset-modal-save" disabled={state.loading} aria-label="저장"><Icon name="check" size={27} /></button>
                            </header>
                            <form id="stock-transaction-form" className="asset-modal-form stock-holding-add-form" onSubmit={handleSubmit}>
                                <div className="stock-transaction-type-selector">
                                    <button type="button" className={form.type === 'Buy' ? 'active buy' : ''} onClick={() => setForm({ ...form, type: 'Buy' })}>매수</button>
                                    <button type="button" className={form.type === 'Sell' ? 'active sell' : ''} onClick={() => setForm({ ...form, type: 'Sell' })}>매도</button>
                                </div>
                                <div className="form-row"><label>주식 자산</label><select value={form.assetId} onChange={e => setForm({ ...form, assetId: e.target.value })} required><option value="">선택</option>{stockAssets.map(asset => <option key={asset.id} value={asset.id}>{asset.name}</option>)}</select></div>
                                <div className="form-row"><label>거래일</label><input type="date" value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} required /></div>
                                <div className="form-row"><label>종목 코드</label><input value={form.symbol} onChange={e => setForm({ ...form, symbol: e.target.value.toUpperCase() })} placeholder="예: 329200:KRX, AAPL" autoCapitalize="characters" required /></div>
                                <div className="form-row"><label>수량</label><input type="number" min="0" step="any" inputMode="decimal" value={form.quantity} onChange={e => setForm({ ...form, quantity: e.target.value })} placeholder="0" required /></div>
                                <div className="form-row"><label>주당 단가</label><input type="number" min="0" step="any" inputMode="decimal" value={form.unitPrice} onChange={e => setForm({ ...form, unitPrice: e.target.value })} placeholder="선택 입력" /></div>
                                <div className="form-row"><label>메모</label><input value={form.memo} onChange={e => setForm({ ...form, memo: e.target.value })} placeholder="선택 입력" /></div>
                                {state.message && <div className={`stock-holding-add-message ${state.loading ? 'loading' : 'error'}`}>{state.loading && <Icon name="loader-circle" size={15} />}{state.message}</div>}
                            </form>
                        </div>
                    </div>}
                </div>
            );
        }

        function AssetModal({ data, setData, onClose, editItem, syncToCloud }) {
            const [form, setForm] = useState(() => {
                if (editItem) {
                    return {
                        ...editItem,
                        stockHoldings: editItem.type === 'Stock' ? (getStockHoldings(editItem).length > 0 ? getStockHoldings(editItem) : [createStockHolding()]) : editItem.stockHoldings,
                        currentDebt: calculateAssetDebt(editItem, data.transactions),
                        priority: editItem.priority !== undefined ? editItem.priority : ''
                    };
                }
                return { name: '', ownerId: data.owners[0]?.id || '', groupId: sortGroupsByPriority(data.groups)[0]?.id || '', type: 'Cash', initialBalance: 0, priority: '', startDate: formatLocalDate(new Date()), stockHoldings: [createStockHolding()] };
            });
            const [stockQuoteState, setStockQuoteState] = useState({ loading: false, message: '' });

            const updateStockHolding = (holdingId, changes) => {
                setForm(current => ({
                    ...current,
                    stockHoldings: getStockHoldings(current).map(holding => holding.id === holdingId ? { ...holding, ...changes } : holding)
                }));
            };

            const addStockHolding = () => {
                setForm(current => ({ ...current, stockHoldings: [...getStockHoldings(current), createStockHolding()] }));
            };

            const removeStockHolding = holdingId => {
                setForm(current => {
                    const remaining = getStockHoldings(current).filter(holding => holding.id !== holdingId);
                    return { ...current, stockHoldings: remaining.length > 0 ? remaining : [createStockHolding()] };
                });
            };

            const loadStockValuation = async (force = true) => {
                const apiKey = data.marketDataApiKey || localStorage.getItem(TWELVE_DATA_API_KEY) || '';
                const koreaApiKeys = getKoreaMarketApiKeys(data);
                if (!apiKey && !koreaApiKeys.stock && !koreaApiKeys.etf) {
                    setStockQuoteState({ loading: false, message: '설정에서 시장 데이터 API 키를 먼저 등록해주세요.' });
                    return null;
                }
                const holdings = getStockHoldings(form);
                if (holdings.length === 0 || holdings.some(holding => !String(holding.symbol || '').trim() || Number(holding.quantity || 0) <= 0)) {
                    setStockQuoteState({ loading: false, message: '모든 종목의 코드와 수량을 입력해주세요.' });
                    return null;
                }
                setStockQuoteState({ loading: true, message: `${holdings.length}개 종목의 전일 종가와 환율을 조회하고 있습니다.` });
                const evaluatedHoldings = [];
                const failures = [];
                const exchangeRateCache = new Map();
                for (const holding of holdings) {
                    const quoteUpdatedAt = new Date(holding.quoteUpdatedAt || '').getTime();
                    const hasFreshQuote = Number(holding.previousClose || 0) > 0 && Number.isFinite(quoteUpdatedAt) && Date.now() - quoteUpdatedAt < STOCK_QUOTE_MAX_AGE_MS;
                    if (!force && hasFreshQuote) {
                        evaluatedHoldings.push({ ...holding, symbol: String(holding.symbol).trim().toUpperCase(), quantity: Number(holding.quantity) });
                        continue;
                    }
                    try {
                        evaluatedHoldings.push(await fetchStockHoldingValuation(holding, apiKey, exchangeRateCache, koreaApiKeys));
                    } catch (error) {
                        evaluatedHoldings.push(holding);
                        failures.push(`${holding.symbol}: ${error.message}`);
                    }
                }
                const valuation = getStockAssetValuationFields(evaluatedHoldings);
                setForm(current => ({ ...current, ...valuation }));
                if (failures.length > 0) {
                    setStockQuoteState({ loading: false, message: failures[0] });
                    return null;
                }
                const priceDates = [...new Set(evaluatedHoldings.map(holding => holding.priceDate).filter(Boolean))];
                setStockQuoteState({ loading: false, message: `${evaluatedHoldings.length}개 종목 · ${priceDates.length === 1 ? priceDates[0] : '최근 거래일'} 전일 종가 기준으로 계산했습니다.` });
                return valuation;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!form.name || !form.ownerId) return;
                if (editItem?.type === 'RealEstate' && form.type !== 'RealEstate' && data.transactions.some(t => t.loanAssetId === editItem.id)) { alert('상환 거래가 연결된 자산은 유형을 변경할 수 없습니다.'); return; }
                let preparedForm = { ...form };
                if (form.type === 'Stock') {
                    const holdings = getStockHoldings(form);
                    if (holdings.length === 0 || holdings.some(holding => !String(holding.symbol || '').trim() || Number(holding.quantity || 0) <= 0)) {
                        alert('모든 주식 종목의 코드와 수량을 입력해주세요.');
                        return;
                    }
                    const allFresh = holdings.every(holding => {
                        const quoteUpdatedAt = new Date(holding.quoteUpdatedAt || '').getTime();
                        return Number(holding.previousClose || 0) > 0 && Number.isFinite(quoteUpdatedAt) && Date.now() - quoteUpdatedAt < STOCK_QUOTE_MAX_AGE_MS;
                    });
                    const valuation = allFresh
                        ? getStockAssetValuationFields(holdings.map(holding => ({ ...holding, symbol: String(holding.symbol).trim().toUpperCase(), quantity: Number(holding.quantity) })))
                        : await loadStockValuation(false);
                    if (!valuation) return;
                    preparedForm = { ...preparedForm, ...valuation };
                }
                const formattedPriority = form.priority !== '' ? Number(form.priority) : 9999;
                preparedForm.initialDebt = form.type === 'RealEstate' ? Number(form.currentDebt || 0) + data.transactions.reduce((sum, t) => sum + (t.type === 'Expense' && t.loanAssetId === editItem?.id ? Number(t.loanPrincipal || 0) : 0), 0) : 0;
                const savedAsset = { ...preparedForm, initialBalance: Number(preparedForm.initialBalance || 0), priority: formattedPriority };
                const newData = { ...data, assets: editItem ? data.assets.map(a => a.id === editItem.id ? savedAsset : a) : [...data.assets, { ...savedAsset, id: Date.now().toString() }] };
                setData(newData);
                syncToCloud(newData);
                onClose();
            };

            const handleDelete = () => {
                if (confirm('이 자산을 삭제하시겠습니까? 관련된 거래 내역 표시에 문제가 생길 수 있습니다.')) {
                    if (data.transactions.some(t => t.loanAssetId === editItem.id)) { alert('대출 상환 거래가 연결되어 있습니다. 상환 거래를 먼저 정리해주세요.'); return; }
                    const newData = { ...data, assets: data.assets.filter(a => a.id !== editItem.id) };
                    setData(newData);
                    syncToCloud(newData);
                    onClose();
                }
            };

            return (
                <div className="asset-modal-overlay">
                    <div className="asset-modal-panel">
                        <header className="asset-modal-header">
                            <button type="button" onClick={onClose} aria-label="닫기"><Icon name="x" size={27} /></button>
                            <h2>자산 {editItem ? '수정' : '추가'}</h2>
                            <button type="submit" form="asset-form" className="asset-modal-save" disabled={!form.name || !form.ownerId || stockQuoteState.loading} aria-label="저장"><Icon name="check" size={27} /></button>
                        </header>
                        <form id="asset-form" className="asset-modal-form" onSubmit={handleSubmit}>
                            <div className="form-row asset-type-row"><label>자산 유형</label><select value={form.type} onChange={e => {
                                const nextType = e.target.value;
                                setForm(current => ({
                                    ...current,
                                    type: nextType,
                                    stockHoldings: nextType === 'Stock' && getStockHoldings(current).length === 0 ? [createStockHolding()] : current.stockHoldings
                                }));
                            }}>{getAssetTypes(data).map(type => <option key={type.value} value={type.value}>{type.label}</option>)}</select></div>
                            <div className="form-row asset-name-row"><label className="sr-only">자산 이름</label><input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="자산 이름" autoFocus required /></div>
                            <div className="asset-extra-fields">
                            <div className="form-row"><label>우선순위</label><input type="number" value={form.priority !== undefined ? form.priority : ''} onChange={e => setForm({ ...form, priority: e.target.value })} placeholder="예: 1 (낮은 숫자 우선)" /></div>
                            <div className="form-row"><label>소유자</label><select value={form.ownerId} onChange={e => setForm({ ...form, ownerId: e.target.value })} required><option value="">선택</option>{data.owners.map(o => <option key={o.id} value={o.id}>{o.name}</option>)}</select></div>
                            <div className="form-row"><label>그룹</label><select value={form.groupId} onChange={e => setForm({ ...form, groupId: e.target.value })}><option value="">선택 (선택사항)</option>{sortGroupsByPriority(data.groups).map(g => <option key={g.id} value={g.id}>{g.name}</option>)}</select></div>
                            <div className="form-row"><label>시작일자</label><input type="date" value={form.startDate || ''} onChange={e => setForm({ ...form, startDate: e.target.value })} /></div>
                            {form.type === 'Stock' ? (
                                <div className="asset-stock-fields">
                                    <div className="asset-stock-heading">
                                        <div><strong>보유 종목</strong><small>Twelve Data 종목 코드와 보유 수량을 입력하세요.</small></div>
                                        <button type="button" onClick={addStockHolding}><Icon name="plus" size={16} /> 종목 추가</button>
                                    </div>
                                    <div className="asset-stock-holding-list">
                                        {getStockHoldings(form).map((holding, index) => (
                                            <div className="asset-stock-holding-card" key={holding.id}>
                                                <div className="asset-stock-holding-header">
                                                    <strong>종목 {index + 1}</strong>
                                                    {getStockHoldings(form).length > 1 && <button type="button" onClick={() => removeStockHolding(holding.id)} aria-label={`${index + 1}번째 종목 삭제`}><Icon name="trash-2" size={16} /></button>}
                                                </div>
                                                <label><span>종목 코드</span><input value={holding.symbol || ''} onChange={e => updateStockHolding(holding.id, { symbol: e.target.value.toUpperCase(), previousClose: '', quoteUpdatedAt: '', priceDate: '' })} placeholder="예: AAPL, 005930:KRX" autoCapitalize="characters" /></label>
                                                <label><span>수량</span><input type="number" min="0" step="any" inputMode="decimal" value={holding.quantity ?? ''} onChange={e => updateStockHolding(holding.id, { quantity: e.target.value })} placeholder="보유 수량" /></label>
                                                {Number(holding.previousClose || 0) > 0 && (
                                                    <div className="asset-stock-holding-value">
                                                        <span>{holding.priceDate || '최근 거래일'} 전일 종가 {Number(holding.previousClose).toLocaleString()} {holding.currency || ''}</span>
                                                        <strong>{getStockHoldingValue(holding).toLocaleString()}원</strong>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                    <small className="stock-symbol-help">국내 종목은 6자리 코드 또는 329200:KRX, 해외 종목은 Twelve Data 코드를 입력하세요. 종목 수에 따라 조회 시간이 늘어날 수 있습니다.</small>
                                    <button type="button" className="stock-quote-button" onClick={() => loadStockValuation(true)} disabled={stockQuoteState.loading}>{stockQuoteState.loading ? '조회 중…' : '전체 종목 평가금 계산'}</button>
                                    {(getStockHoldings(form).some(holding => Number(holding.previousClose || 0) > 0) || stockQuoteState.message) && (
                                        <div className="asset-stock-valuation">
                                            <span>전체 평가금</span>
                                            <strong>{getStockHoldings(form).some(holding => Number(holding.previousClose || 0) > 0) ? `${getStockHoldings(form).reduce((sum, holding) => sum + getStockHoldingValue(holding), 0).toLocaleString()}원` : '조회 필요'}</strong>
                                            {stockQuoteState.message && <small className={stockQuoteState.message.includes('계산했습니다') ? 'success' : 'error'}>{stockQuoteState.message}</small>}
                                        </div>
                                    )}
                                </div>
                            ) : <div className="form-row" style={{ alignItems: 'flex-start' }}>
                                <label style={{ marginTop: '10px' }}>{form.type === 'RealEstate' ? '초기금액' : '초기 잔액'}</label>
                                <div className="quick-amount-container">
                                    <input type="text" value={form.initialBalance ? Number(form.initialBalance).toLocaleString() : ''} onChange={e => {
                                        const val = e.target.value.replace(/[^0-9]/g, '');
                                        setForm({ ...form, initialBalance: val });
                                    }} placeholder="0원" />
                                    <div className="quick-amount-buttons">
                                        <button type="button" onClick={() => {
                                            const current = Number(form.initialBalance || 0);
                                            setForm({ ...form, initialBalance: (current + 1000000).toString() });
                                        }}>백만</button>
                                        <button type="button" onClick={() => {
                                            const current = Number(form.initialBalance || 0);
                                            setForm({ ...form, initialBalance: (current + 100000).toString() });
                                        }}>십만</button>
                                        <button type="button" onClick={() => {
                                            const current = Number(form.initialBalance || 0);
                                            setForm({ ...form, initialBalance: (current + 10000).toString() });
                                        }}>만</button>
                                        <button type="button" onClick={() => {
                                            const current = Number(form.initialBalance || 0);
                                            setForm({ ...form, initialBalance: (current + 1000).toString() });
                                        }}>천</button>
                                        <button type="button" onClick={() => {
                                            const current = Number(form.initialBalance || 0);
                                            setForm({ ...form, initialBalance: (current + 100).toString() });
                                        }}>백</button>
                                        <button type="button" onClick={() => {
                                            const current = Number(form.initialBalance || 0);
                                            setForm({ ...form, initialBalance: (current + 10).toString() });
                                        }}>십</button>
                                        <button type="button" className="clear-btn" onClick={() => setForm({ ...form, initialBalance: '' })}>지우기</button>
                                    </div>
                                </div>
                            </div>}
                            {form.type === 'RealEstate' && (
                                <>
                                    <div className="form-row"><label>현재 부채</label><input inputMode="numeric" value={Number(form.currentDebt || 0).toLocaleString()} onChange={e => setForm({ ...form, currentDebt: e.target.value.replace(/[^0-9]/g, '') })} aria-label="현재 부채" /></div>
                                    <div className="asset-evaluation-preview">
                                        <span>평가금</span>
                                        <strong>{(Number(form.initialBalance || 0) - Number(form.currentDebt || 0)).toLocaleString()}원</strong>
                                        <small>초기금액 − 현재 부채</small>
                                    </div>
                                </>
                            )}
                            </div>
                            <div className="asset-modal-footer">
                                {editItem && <button type="button" className="danger" onClick={handleDelete}>자산 삭제</button>}
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function TransactionModal({ data, setData, onClose, editItem, syncToCloud, isConnected, user }) {
            const [form, setForm] = useState(() => {
                const groups = data.groups || [];
                const firstGroup = groups.length > 0 ? groups[0].id : '';
                
                // 작성자 약칭 설정에서 현재 로그인이메일의 초기그룹 찾기
                const userEmail = user?.email;
                const authorAbbr = (data.authorAbbreviations || []).find(a => a.email === userEmail);
                const authorDefaultGroup = authorAbbr?.defaultGroupId;
                const defaultGroup = (authorDefaultGroup && groups.some(g => g.id === authorDefaultGroup)) ? authorDefaultGroup : firstGroup;

                const getTodayKST = () => { const now = new Date(); const kst = new Date(now.getTime() + 9 * 60 * 60 * 1000); return kst.toISOString().split('T')[0]; };
                const initial = editItem ? { ...editItem } : { date: getTodayKST(), type: 'Expense', amount: '', categoryId: '', groupId: defaultGroup, assetId: '', toGroupId: firstGroup, toAssetId: '', memo: '' };

                // 기존 기록 수정인 경우 자산 정보로부터 그룹 가져오기
                if (editItem) {
                    const fromAsset = data.assets.find(a => a.id === editItem.assetId);
                    if (fromAsset) initial.groupId = fromAsset.groupId || '';
                    if (editItem.type === 'Transfer') {
                        const toAsset = data.assets.find(a => a.id === editItem.toAssetId);
                        if (toAsset) initial.toGroupId = toAsset.groupId || '';
                    }
                }
                const initialGroup = initial.groupId || defaultGroup;
                const matchedAssets = data.assets.filter(a => initialGroup ? a.groupId === initialGroup : true).sort((a, b) => Number(a.priority || 9999) - Number(b.priority || 9999));
                if (!initial.assetId && matchedAssets.length > 0) {
                    initial.assetId = matchedAssets[0].id;
                }
                return { ...initial, groupId: initialGroup, toGroupId: initial.toGroupId || firstGroup };
            });
            const filteredAssets = data.assets.filter(a => form.groupId ? a.groupId === form.groupId : true).sort((a, b) => Number(a.priority || 9999) - Number(b.priority || 9999));
            const filteredToAssets = data.assets.filter(a => (form.toGroupId ? a.groupId === form.toGroupId : true) && a.id !== form.assetId).sort((a, b) => Number(a.priority || 9999) - Number(b.priority || 9999));
            const filteredCategories = data.categories.filter(c => c.type === form.type);
            const selectedCategory = data.categories.find(category => category.id === form.categoryId);
            const isLoanPayment = form.type === 'Expense' && selectedCategory?.name === '대출';
            useEffect(() => {
                if (filteredAssets.length > 0 && !filteredAssets.find(a => a.id === form.assetId)) setForm(f => ({ ...f, assetId: filteredAssets[0].id }));
                if (form.type === 'Transfer' && filteredToAssets.length > 0 && !filteredToAssets.find(a => a.id === form.toAssetId)) {
                    setForm(f => ({ ...f, toAssetId: filteredToAssets[0].id }));
                }
            }, [form.groupId, form.type, form.toGroupId]);
            useEffect(() => {
                if (form.categoryId && !filteredCategories.some(category => category.id === form.categoryId)) {
                    setForm(current => ({ ...current, categoryId: '' }));
                }
            }, [form.type]);
            const handleSubmit = (e) => {
                if (e) e.preventDefault();
                if (isLoanPayment) {
                    form.isLoanPayment = true;
                    const debtAsset = data.assets.find(a => a.id === form.loanAssetId && a.type === 'RealEstate');
                    const principal = Number(form.loanPrincipal || 0);
                    const interest = Number(form.loanInterest || 0);
                    if (!debtAsset || !Number.isSafeInteger(principal) || !Number.isSafeInteger(interest) || principal < 0 || interest < 0 || principal + interest <= 0) { alert('상환할 자산과 원금·이자를 확인해주세요.'); return; }
                    if (principal > calculateAssetDebt(debtAsset, data.transactions.filter(t => t.id !== editItem?.id))) { alert('상환 원금이 남은 부채보다 큽니다.'); return; }
                    if (data.assets.find(a => a.id === form.assetId)?.type === 'RealEstate') { alert('출금되는 현금 또는 금융 자산을 선택해주세요.'); return; }
                    form.amount = principal + interest;
                } else {
                    form.isLoanPayment = false;
                    form.loanAssetId = '';
                    form.loanPrincipal = 0;
                    form.loanInterest = 0;
                }
                if (form.type === 'Transfer' && form.assetId === form.toAssetId) { alert('동일 자산 간 이체는 불가합니다.'); return; }
                if (!isConnected) { alert('Firebase 서버와 연결되지 않아 저장할 수 없습니다.'); return; }
                const authorEmail = editItem?.authorEmail || user?.email || '';
                const newData = { ...data, transactions: editItem ? data.transactions.map(t => t.id === editItem.id ? { ...form, id: editItem.id, authorEmail } : t) : [...data.transactions, { ...form, id: Date.now().toString(), authorEmail }] };
                setData(newData);
                syncToCloud(newData);
                onClose();
            };
            const handleDelete = () => {
                if (confirm('이 거래 내역을 삭제하시겠습니까?')) {
                    const newData = { ...data, transactions: data.transactions.filter(t => t.id !== editItem.id) };
                    setData(newData);
                    syncToCloud(newData);
                    onClose();
                }
            };
            const handleAmountChange = (e) => {
                const val = e.target.value.replace(/[^0-9]/g, '');
                setForm({ ...form, amount: val });
            };
            const handleQuickAmount = (val) => {
                const current = Number(form.amount || 0);
                setForm({ ...form, amount: (current + val).toString() });
            };
            const clearAmount = () => setForm({ ...form, amount: '' });

            const [viewportStyle, setViewportStyle] = useState({});
            useEffect(() => {
                const viewport = window.visualViewport;
                if (!viewport) return;
                const updateViewport = () => setViewportStyle({ top: `${viewport.offsetTop}px`, bottom: 'auto', height: `${viewport.height}px` });
                updateViewport();
                viewport.addEventListener('resize', updateViewport);
                viewport.addEventListener('scroll', updateViewport);
                return () => {
                    viewport.removeEventListener('resize', updateViewport);
                    viewport.removeEventListener('scroll', updateViewport);
                };
            }, []);

            const focusIntoView = event => {
                const input = event.currentTarget;
                requestAnimationFrame(() => input.scrollIntoView({ block: 'center' }));
            };

            const paymentTotal = isLoanPayment ? Number(form.loanPrincipal || 0) + Number(form.loanInterest || 0) : Number(form.amount || 0);
            const canSave = isConnected && form.date && form.categoryId && form.assetId && paymentTotal > 0 && (!isLoanPayment || form.loanAssetId) && (form.type !== 'Transfer' || form.toAssetId);

            return (
                <div className="transaction-modal-overlay" style={viewportStyle} role="presentation">
                    <section className="transaction-modal-panel" role="dialog" aria-modal="true" aria-labelledby="transaction-modal-title">
                        <header className="transaction-modal-header">
                            <button type="button" onClick={onClose} aria-label="닫기"><Icon name="x" size={27} /></button>
                            <h2 id="transaction-modal-title">거래 {editItem ? '수정' : '추가'}</h2>
                            <button type="submit" form="transaction-entry-form" className="transaction-modal-save" disabled={!canSave} aria-label="저장"><Icon name="check" size={27} /></button>
                        </header>
                        {!isConnected && (
                            <div className="sync-warning transaction-modal-warning">
                                <Icon name="alert-circle" size={18} />
                                <span>Firebase에 연동되지 않아 작성이 제한됩니다.</span>
                            </div>
                        )}
                        <form id="transaction-entry-form" className="transaction-modal-form" onSubmit={handleSubmit}>
                            <div className="transaction-type-card">
                                <span>거래 유형</span>
                                <div className="type-button-group transaction-type-buttons">
                                    <button type="button" className={`${form.type === 'Income' ? 'active' : ''} ${!isConnected ? 'btn-disabled' : ''}`} data-type="Income" onClick={() => setForm({ ...form, type: 'Income' })}>수입</button>
                                    <button type="button" className={`${form.type === 'Expense' ? 'active' : ''} ${!isConnected ? 'btn-disabled' : ''}`} data-type="Expense" onClick={() => setForm({ ...form, type: 'Expense' })}>지출</button>
                                    <button type="button" className={`${form.type === 'Transfer' ? 'active' : ''} ${!isConnected ? 'btn-disabled' : ''}`} data-type="Transfer" onClick={() => setForm({ ...form, type: 'Transfer' })}>이체</button>
                                </div>
                            </div>
                            <label className="transaction-form-card"><span>날짜</span><input type="date" value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} required /></label>
                            <label className="transaction-form-card"><span>카테고리</span><select value={form.categoryId} onChange={e => setForm({ ...form, categoryId: e.target.value })} required disabled={!isConnected}><option value="">선택하세요</option>{filteredCategories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select></label>
                            {isLoanPayment && <>
                                <label className="transaction-form-card"><span>자산</span><select required value={form.loanAssetId || ''} onChange={e => setForm({ ...form, loanAssetId: e.target.value })}><option value="">선택하세요</option>{data.assets.filter(a => a.type === 'RealEstate').map(a => <option key={a.id} value={a.id}>{a.name}</option>)}</select></label>
                                {data.assets.filter(a => a.type === 'RealEstate').length === 0 && <p>자산 페이지에서 부채가 있는 자산을 먼저 등록해주세요.</p>}
                                {['loanPrincipal', 'loanInterest'].map(key => <label key={key} className="transaction-form-card"><span>{key === 'loanPrincipal' ? '상환 원금' : '이자'}</span><input inputMode="numeric" value={form[key] ? Number(form[key]).toLocaleString() : ''} placeholder="0원" onChange={e => setForm({ ...form, [key]: e.target.value.replace(/[^0-9]/g, '') })} /></label>)}
                                <div className="transaction-form-card"><span>총 출금액</span><strong>{paymentTotal.toLocaleString()}원</strong></div>
                            </>}
                            <div className="transaction-amount-card" hidden={!!isLoanPayment}>
                                <div className="transaction-amount-input">
                                    <label htmlFor="transaction-amount">금액</label>
                                    <div><input id="transaction-amount" type="text" inputMode="numeric" value={form.amount ? Number(form.amount).toLocaleString() : ''} onChange={handleAmountChange} onFocus={focusIntoView} placeholder="0" required={!isLoanPayment} disabled={!isConnected || !!isLoanPayment} /><b>원</b></div>
                                </div>
                                <div className="quick-amount-buttons transaction-quick-amounts">
                                        <button type="button" onClick={() => handleQuickAmount(1000000)} disabled={!isConnected}>백만</button>
                                        <button type="button" onClick={() => handleQuickAmount(100000)} disabled={!isConnected}>십만</button>
                                        <button type="button" onClick={() => handleQuickAmount(10000)} disabled={!isConnected}>만</button>
                                        <button type="button" onClick={() => handleQuickAmount(1000)} disabled={!isConnected}>천</button>
                                        <button type="button" onClick={() => handleQuickAmount(100)} disabled={!isConnected}>백</button>
                                        <button type="button" onClick={() => handleQuickAmount(10)} disabled={!isConnected}>십</button>
                                        <button type="button" className="clear-btn" onClick={clearAmount} disabled={!isConnected}>지우기</button>
                                </div>
                            </div>
                            <label className="transaction-form-card"><span>그룹 {form.type === 'Transfer' ? '(출금)' : ''}</span><select value={form.groupId} onChange={e => setForm({ ...form, groupId: e.target.value })} disabled={!isConnected}><option value="">전체/미지정</option>{sortGroupsByPriority(data.groups).map(g => <option key={g.id} value={g.id}>{g.name}</option>)}</select></label>
                            <label className="transaction-form-card"><span>{form.type === 'Transfer' ? '출금 자산' : '자산'}</span><select value={form.assetId} onChange={e => setForm({ ...form, assetId: e.target.value })} disabled={!isConnected}>{filteredAssets.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}</select></label>
                            {form.type === 'Transfer' && (

            return (

                    <div className="notification-settings-heading">
                        <span><Icon name="bell-ring" size={21} /></span>

                    {iosNeedsInstall && (
                        <div className="notification-guide warning">

                        </div>
                    )}
                    {!window.isSecureContext && <div className="notification-guide warning"><Icon name="shield-alert" size={18} /><span>푸시 알림은 HTTPS 주소에서만 사용할 수 있습니다.</span></div>}
                    {!isConnected && <div className="notification-guide"><Icon name="log-in" size={18} /><span>Firebase 설정과 Google 로그인을 완료한 후 기기를 등록할 수 있습니다.</span></div>}

                    <label className="notification-vapid-field">
                        <span>VAPID 공개키</span>
                        <input value={vapidKey} onChange={event => setVapidKey(event.target.value.trim())} onBlur={() => localStorage.setItem(NOTIFICATION_VAPID_KEY, vapidKey.trim())} placeholder="Firebase Web Push 인증서 공개키" autoComplete="off" />
                        <small>Firebase Console → 프로젝트 설정 → Cloud Messaging → Web Push 인증서에서 확인할 수 있습니다.</small>

                    {installPrompt && !isStandaloneApp() && <button type="button" className="notification-install-button" onClick={installApp}><Icon name="download" size={17} />웹앱 설치</button>}

                    <div className="notification-action-row">
                        {!enabled ? <button type="button" className="primary" onClick={enableNotifications} disabled={busy || !supported || !isConnected || iosNeedsInstall}>{busy ? '등록 중...' : '알림 활성화'}</button> : <button type="button" className="notification-disable-button" onClick={disableNotifications} disabled={busy}>{busy ? '처리 중...' : '알림 해제'}</button>}
                        <button type="button" onClick={showTestNotification} disabled={!enabled || busy}>기기 테스트</button>
                        <button type="button" onClick={copyToken} disabled={!token}>토큰 복사</button>
                    </div>

                    {token && <details className="notification-token"><summary>FCM 테스트 토큰 보기</summary><code>{token}</code><small>Firebase Console의 Messaging에서 테스트 메시지를 만들고 이 토큰을 대상 기기로 입력하면 백그라운드 수신을 확인할 수 있습니다.</small></details>}
                    {message && <p className={`notification-result ${message.includes('완료') || message.includes('복사') || message.includes('전송') || message.includes('해제') ? 'success' : ''}`}>{message}</p>}
                </section>
            );
        }

        function Settings({ data, setData, fbConfig, setFbConfig, syncToCloud, user, isConnected, setTab }) {

            const [koreaEtfApiKey, setKoreaEtfApiKey] = useState(() => initialKoreaApiKeys.etf);

            const [activeTab, setActiveTab] = useState('general'); // general, owners, groups, categories, assets, authors

            const [editingAsset, setEditingAsset] = useState(null);
            const [showAssetModal, setShowAssetModal] = useState(false);
            const [tempSharedId, setTempSharedId] = useState(localStorage.getItem(SHARED_ID_KEY) || '');

            useMobileEdgeSwipeBack(() => {
                if (activeTab !== 'general') setActiveTab('general');

            });

            useEffect(() => {
                setMarketApiKey(data.marketDataApiKey || localStorage.getItem(TWELVE_DATA_API_KEY) || '');
                const koreaKeys = getKoreaMarketApiKeys(data);
                setKoreaStockApiKey(koreaKeys.stock);
                setKoreaEtfApiKey(koreaKeys.etf);
            }, [data.marketDataApiKey, data.koreaMarketApiKey, data.koreaStockApiKey, data.koreaEtfApiKey]);

            const saveFb = async () => {
                try {
                    const c = JSON.parse(fbVal);
                    if (!c.apiKey || !c.projectId) {
                        alert('올바른 Firebase 웹 설정 형식이 아닙니다.\n"apiKey"와 "projectId"가 포함된 JSON을 입력해주세요.\n(주의: 서비스 계정 키 파일이 아닙니다)');
                        return;
                    }
                    if (localStorage.getItem(NOTIFICATION_ENABLED_KEY) === 'true') await unregisterNotificationDevice(user);
                    localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(c));
                    setFbConfig(c);
                    alert('Firebase 설정이 저장되었습니다. 앱을 다시 시작합니다.');
                    location.reload();
                } catch (e) {
                    alert('유효한 JSON 형식이 아닙니다.');
                }
            };
            const resetFb = async () => { if (confirm('서버 설정을 초기화하시겠습니까?')) { await unregisterNotificationDevice(user); localStorage.removeItem(FIREBASE_CONFIG_KEY); setFbConfig(null); alert('설정이 초기화되었습니다.'); location.reload(); } };
            const changePw = () => { if (newPw.length < 4) { alert('비밀번호는 4자리 이상이어야 합니다.'); return; } localStorage.setItem(PASSWORD_KEY, newPw); setNewPw(''); alert('비밀번호가 변경되었습니다.'); };
            const saveMarketApiKey = () => {
                const value = marketApiKey.trim();
                const koreaStockValue = koreaStockApiKey.trim();
                const koreaEtfValue = koreaEtfApiKey.trim();
                if (!value && !koreaStockValue && !koreaEtfValue) {
                    alert('해외 또는 국내 시장 데이터 API 키를 입력해주세요.');
                    return;
                }
                if (!isConnected) {
                    if (data.marketDataApiKey || data.koreaMarketApiKey || data.koreaStockApiKey || data.koreaEtfApiKey) {
                        setMarketApiKey(data.marketDataApiKey);
                        const koreaKeys = getKoreaMarketApiKeys(data);
                        setKoreaStockApiKey(koreaKeys.stock);
                        setKoreaEtfApiKey(koreaKeys.etf);
                        alert('공용 API 키를 변경하려면 Firebase에 로그인해주세요.');
                        return;
                    }
                    if (value) localStorage.setItem(TWELVE_DATA_API_KEY, value);
                    if (koreaStockValue) localStorage.setItem(KOREA_STOCK_API_KEY, koreaStockValue);
                    if (koreaEtfValue) localStorage.setItem(KOREA_ETF_API_KEY, koreaEtfValue);
                    setMarketApiKey(value);
                    setKoreaStockApiKey(koreaStockValue);
                    setKoreaEtfApiKey(koreaEtfValue);
                    alert('API 키를 임시 저장했습니다. Firebase 로그인 후 공용 설정으로 자동 이전됩니다.');
                    return;
                }
                const newData = { ...data, marketDataApiKey: value, koreaMarketApiKey: '', koreaStockApiKey: koreaStockValue, koreaEtfApiKey: koreaEtfValue };
                setData(newData);
                syncToCloud(newData);
                localStorage.removeItem(TWELVE_DATA_API_KEY);
                localStorage.removeItem(KOREA_MARKET_API_KEY);
                localStorage.removeItem(KOREA_STOCK_API_KEY);
                localStorage.removeItem(KOREA_ETF_API_KEY);
                setMarketApiKey(value);
                setKoreaStockApiKey(koreaStockValue);
                setKoreaEtfApiKey(koreaEtfValue);
                const sharedId = localStorage.getItem(SHARED_ID_KEY);
                alert(sharedId
                    ? '시장 데이터 API 키가 공용 설정에 저장되었습니다. 같은 공유 ID 사용자는 별도 입력 없이 이용할 수 있습니다.'
                    : '시장 데이터 API 키가 개인 클라우드 설정에 저장되었습니다. 다른 사용자와 함께 사용하려면 동일한 공유 ID를 설정해주세요.');
            };
            const clearMarketApiKey = () => {
                if ((data.marketDataApiKey || data.koreaMarketApiKey || data.koreaStockApiKey || data.koreaEtfApiKey) && !isConnected) {

                localStorage.removeItem(TWELVE_DATA_API_KEY);
                localStorage.removeItem(KOREA_MARKET_API_KEY);
                localStorage.removeItem(KOREA_STOCK_API_KEY);
                localStorage.removeItem(KOREA_ETF_API_KEY);
                setMarketApiKey('');
                setKoreaStockApiKey('');
                setKoreaEtfApiKey('');
            };
            const refreshMarketPrices = async () => {
                const apiKey = marketApiKey.trim() || data.marketDataApiKey || localStorage.getItem(TWELVE_DATA_API_KEY) || '';
                const koreaApiKeys = getKoreaMarketApiKeys(data, { stock: koreaStockApiKey.trim(), etf: koreaEtfApiKey.trim() });
                if (!apiKey && !koreaApiKeys.stock && !koreaApiKeys.etf) {
                    setMarketRefreshState({ loading: false, message: '시장 데이터 API 키를 먼저 입력해주세요.' });
                    return;
                }
                setMarketRefreshState({ loading: true, message: '전체 종목의 전일 종가와 환율을 확인하고 있습니다.' });
                const result = await refreshStockAssetQuotes(data, apiKey, true, koreaApiKeys);
                if (result.stockAssetCount === 0) {
                    setMarketRefreshState({ loading: false, message: '시세를 갱신할 주식 종목이 없습니다.' });
                    return;
                }
                if (result.changed) {
                    setData(result.newData);
                    syncToCloud(result.newData);
                }
                setMarketRefreshState({
                    loading: false,
                    message: result.failures.length > 0
                        ? `${result.refreshedCount}개 갱신 · ${result.failures[0]}`
                        : `${result.refreshedCount}개 종목의 시세를 갱신했습니다.`
                });
            };

            const saveSharedId = () => {
                if (tempSharedId.trim()) {
                    localStorage.setItem(SHARED_ID_KEY, tempSharedId.trim());
                    alert('공유 ID가 저장되었습니다. 앱을 다시 시작합니다.');
                    location.reload();
                } else {
                    localStorage.removeItem(SHARED_ID_KEY);
                    alert('공유 ID가 제거되었습니다. 개인 모드로 전환합니다.');
                    location.reload();
                }
            };
            const generateSharedId = () => {
                const newId = Math.random().toString(36).substring(2, 10).toUpperCase();
                setTempSharedId(newId);
                alert(`신규 공유 ID가 생성되었습니다: ${newId}\n'저장' 버튼을 눌러야 적용됩니다.`);
            };

            const handleExportData = () => { const now = new Date(); const kst = new Date(now.getTime() + 9 * 60 * 60 * 1000); const todayKST = kst.toISOString().split('T')[0]; const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `household_backup_${todayKST}.json`; a.click(); };
            const handleImportData = (e) => { 
                const file = e.target.files[0]; 
                if (!file) return; 
                const reader = new FileReader(); 
                reader.onload = (ev) => { 
                    try { 
                        const d = JSON.parse(ev.target.result); 
                        if (confirm('데이터를 덮어쓰시겠습니까? 현재 데이터는 사라집니다.')) {

            // Management Functions

            const addGroup = () => {

                const enteredPriority = Number(newGroupPriority);
                const nextPriority = groups.reduce((max, group, index) => Math.max(max, getGroupPriority(group, index)), 0) + 1;
                const priority = newGroupPriority !== '' && Number.isFinite(enteredPriority)
                    ? Math.max(1, Math.floor(enteredPriority))
                    : nextPriority;
                const newData = { ...data, groups: [...groups, { id: Date.now().toString(), name, priority }] };
                setData(newData);
                syncToCloud(newData);
                setNewGroup('');
                setNewGroupPriority('');

            const updateGroupPriority = (id) => {

                const newData = {

                setData(newData);

                                            <pre style={{ background: '#0d1117', padding: '10px', borderRadius: '4px', fontSize: '0.75rem', color: '#8b949e', marginTop: '8px', overflowX: 'auto' }}>
{`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /users/{userId} {
      allow read, write: if request.auth != null && request.auth.uid == userId;
    }
    match /shared_data/{sharedId} {
      allow read, write: if request.auth != null;
    }
    match /notification_subscriptions/{userId}/devices/{deviceId} {
      allow read, write: if request.auth != null && request.auth.uid == userId;

}`}
