        function ShoppingPage({ data, setData, syncToCloud, setTab, isConnected }) {
            const [itemName, setItemName] = useState('');
            const [favoriteOnAdd, setFavoriteOnAdd] = useState(false);
            const inputRef = React.useRef(null);
            useMobileEdgeSwipeBack(() => setTab('home'));
            const items = data.shoppingItems || [];
            const favorites = data.shoppingFavorites || [];
            const normalizeName = name => name.trim().replace(/\s+/g, ' ');
            const isSameName = (left, right) => normalizeName(left).toLocaleLowerCase() === normalizeName(right).toLocaleLowerCase();

            const commit = (nextItems, nextFavorites = favorites) => {
                const newData = { ...data, shoppingItems: nextItems, shoppingFavorites: nextFavorites };
                setData(newData);
                syncToCloud(newData);
            };

            const requireConnection = () => {
                if (isConnected) return true;
                alert('Firebase 연동이 필요합니다.');
                return false;
            };

            const addItem = event => {
                event.preventDefault();
                if (!requireConnection()) return;
                const name = normalizeName(itemName);
                if (!name) return;
                const alreadyListed = items.some(item => isSameName(item.name, name));
                const nextItems = alreadyListed ? items : [...items, { id: Date.now().toString(), name, createdAt: Date.now() }];
                const alreadyFavorite = favorites.some(item => isSameName(item.name, name));
                const nextFavorites = favoriteOnAdd && !alreadyFavorite ? [...favorites, { id: `favorite-${Date.now()}`, name }] : favorites;
                commit(nextItems, nextFavorites);
                setItemName('');
                inputRef.current?.focus();
            };

            const addFavoriteToList = favorite => {
                if (!requireConnection() || items.some(item => isSameName(item.name, favorite.name))) return;
                commit([...items, { id: Date.now().toString(), name: favorite.name, createdAt: Date.now() }]);
            };

            const toggleFavorite = item => {
                if (!requireConnection()) return;
                const existing = favorites.find(favorite => isSameName(favorite.name, item.name));
                const nextFavorites = existing
                    ? favorites.filter(favorite => favorite.id !== existing.id)
                    : [...favorites, { id: `favorite-${Date.now()}`, name: item.name }];
                commit(items, nextFavorites);
            };

            const removeFavorite = favoriteId => {
                if (!requireConnection()) return;
                commit(items, favorites.filter(favorite => favorite.id !== favoriteId));
            };

            const completeItem = itemId => {
                if (!requireConnection()) return;
                commit(items.filter(item => item.id !== itemId));
            };

            return (
                <div className="shopping-page fade-in">
                    <div className="shopping-toolbar">
                        <button className="transaction-round-button" onClick={() => setTab('home')} aria-label="홈으로 돌아가기"><Icon name="chevron-left" size={20} /></button>
                        <strong>장바구니</strong>
                        <span className="shopping-count">{items.length}</span>
                    </div>

                    <form className="shopping-add-card" onSubmit={addItem}>
                        <div>
                            <span className="shopping-add-icon"><Icon name="shopping-basket" size={21} /></span>
                            <input ref={inputRef} value={itemName} onChange={event => setItemName(event.target.value)} placeholder="살 품목을 입력하세요" aria-label="장보기 품목" disabled={!isConnected} />
                            <button type="button" className={favoriteOnAdd ? 'active' : ''} onClick={() => setFavoriteOnAdd(value => !value)} aria-label="추가하면서 즐겨찾기"><Icon name="star" size={20} /></button>
                        </div>
                        <button type="submit" className="shopping-add-button" disabled={!isConnected || !normalizeName(itemName)}><Icon name="plus" size={20} />목록에 추가</button>
                    </form>

                    <section className="shopping-favorites-card">
                        <header><span><Icon name="star" size={17} />즐겨찾기</span><small>눌러서 빠르게 추가</small></header>
                        {favorites.length > 0 ? (
                            <div className="shopping-favorites-list">
                                {favorites.map(favorite => {
                                    const isListed = items.some(item => isSameName(item.name, favorite.name));
                                    return (
                                        <span key={favorite.id} className={isListed ? 'listed' : ''}>
                                            <button onClick={() => addFavoriteToList(favorite)} disabled={isListed} aria-label={`${favorite.name} 목록에 추가`}><Icon name={isListed ? 'check' : 'plus'} size={14} />{favorite.name}</button>
                                            <button onClick={() => removeFavorite(favorite.id)} aria-label={`${favorite.name} 즐겨찾기 삭제`}><Icon name="x" size={13} /></button>
                                        </span>
                                    );
                                })}
                            </div>
                        ) : <p className="shopping-favorites-empty">품목의 별을 누르면 여기에 저장됩니다.</p>}
                    </section>

                    <section className="shopping-list-section">
                        <header><div><strong>살 품목</strong><small>{items.length > 0 ? `${items.length}개 남음` : '목록이 비어 있어요'}</small></div></header>
                        {items.length > 0 ? (
                            <div className="shopping-list-card">
                                {items.map(item => {
                                    const isFavorite = favorites.some(favorite => isSameName(favorite.name, item.name));
                                    return (
                                        <div key={item.id} className="shopping-item-row">
                                            <button className={`shopping-item-star ${isFavorite ? 'active' : ''}`} onClick={() => toggleFavorite(item)} aria-label={`${item.name} 즐겨찾기 ${isFavorite ? '해제' : '추가'}`}><Icon name="star" size={20} /></button>
                                            <strong>{item.name}</strong>
                                            <button className="shopping-item-complete" onClick={() => completeItem(item.id)} aria-label={`${item.name} 구매 완료 및 삭제`}><Icon name="check" size={22} /></button>
                                        </div>
                                    );
                                })}
                            </div>
                        ) : (
                            <div className="shopping-empty-state"><span><Icon name="shopping-basket" size={28} /></span><strong>장볼 준비가 끝났어요</strong><p>위 입력창이나 즐겨찾기에서 품목을 추가해 보세요.</p></div>
                        )}
                    </section>
                </div>
            );
        }

        function BudgetModal({ data, selectedMonth, editBudget, setData, syncToCloud, onClose }) {
            const expenseCategories = data.categories.filter(category => category.type === 'Expense');
            const [viewportStyle, setViewportStyle] = useState({});
            const [form, setForm] = useState(() => ({
                categoryId: editBudget?.categoryId || expenseCategories[0]?.id || '',
                amount: editBudget?.amount || ''
            }));

            useEffect(() => {
                const viewport = window.visualViewport;
                if (!viewport) return;
                const updateViewport = () => setViewportStyle({
                    top: `${viewport.offsetTop}px`,
                    bottom: 'auto',
                    height: `${viewport.height}px`
                });
                updateViewport();
                viewport.addEventListener('resize', updateViewport);
                viewport.addEventListener('scroll', updateViewport);
                return () => {
                    viewport.removeEventListener('resize', updateViewport);
                    viewport.removeEventListener('scroll', updateViewport);
                };
            }, []);

            const handleSubmit = event => {
                event.preventDefault();
                const amount = Number(form.amount || 0);
                if (!form.categoryId || amount <= 0) return;
                const budgets = data.budgets || [];
                const duplicate = budgets.find(budget => budget.month === selectedMonth && budget.categoryId === form.categoryId);
                const savedBudget = { id: editBudget?.id || duplicate?.id || Date.now().toString(), month: selectedMonth, categoryId: form.categoryId, amount };
                const targetId = editBudget?.id || duplicate?.id;
                const cleanedBudgets = budgets.filter(budget => !(budget.month === selectedMonth && budget.categoryId === form.categoryId && budget.id !== targetId));
                const newData = {
                    ...data,
                    budgets: targetId ? cleanedBudgets.map(budget => budget.id === targetId ? savedBudget : budget) : [...cleanedBudgets, savedBudget]
                };
                setData(newData);
                syncToCloud(newData);
                onClose();
            };

            const handleDelete = () => {
                if (!editBudget || !confirm('이 예산을 삭제하시겠습니까?')) return;
                const newData = { ...data, budgets: (data.budgets || []).filter(budget => budget.id !== editBudget.id) };
                setData(newData);
                syncToCloud(newData);
                onClose();
            };

            return (
                <div className="budget-modal-overlay" style={viewportStyle} role="presentation" onClick={onClose}>
                    <section className="budget-modal-sheet" role="dialog" aria-modal="true" aria-labelledby="budget-modal-title" onClick={event => event.stopPropagation()}>
                        <header>
                            <button type="button" onClick={onClose} aria-label="닫기"><Icon name="x" size={25} /></button>
                            <strong id="budget-modal-title">예산 {editBudget ? '수정' : '생성'}</strong>
                            <button type="submit" form="budget-form" className="budget-save-button" disabled={!form.categoryId || Number(form.amount || 0) <= 0} aria-label="저장"><Icon name="check" size={24} /></button>
                        </header>
                        <form id="budget-form" onSubmit={handleSubmit}>
                            <label>
                                <span>적용 월</span>
                                <strong>{selectedMonth.split('-')[0]}년 {Number(selectedMonth.split('-')[1])}월</strong>
                            </label>
                            <label>
                                <span>카테고리</span>
                                <select value={form.categoryId} onChange={event => setForm({ ...form, categoryId: event.target.value })}>
                                    {expenseCategories.map(category => <option key={category.id} value={category.id}>{category.name}</option>)}
                                </select>
                            </label>
                            <label>
                                <span>예산</span>
                                <input type="text" inputMode="numeric" value={form.amount ? Number(form.amount).toLocaleString() : ''} onChange={event => setForm({ ...form, amount: event.target.value.replace(/[^0-9]/g, '') })} onFocus={event => { const input = event.currentTarget; requestAnimationFrame(() => input.scrollIntoView({ block: 'center' })); }} placeholder="0원" autoFocus />
                            </label>
                            {editBudget && <button type="button" className="budget-delete-button" onClick={handleDelete}>예산 삭제</button>}
                        </form>
                    </section>
                </div>
            );
        }

        function PlanPage({ data, setData, syncToCloud, setTab }) {
            const now = new Date();
            const [selectedMonth, setSelectedMonth] = useState(`${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`);
            const [showMonthPicker, setShowMonthPicker] = useState(false);
            const [showBudgetModal, setShowBudgetModal] = useState(false);
            const [editingBudget, setEditingBudget] = useState(null);
            const selectedMonthRef = React.useRef(null);

            useMobileEdgeSwipeBack(() => {
                if (showMonthPicker) setShowMonthPicker(false);
                else setTab('home');
            });

            const availableMonths = useMemo(() => {
                const months = new Set([
                    ...data.transactions.map(transaction => transaction.date.substring(0, 7)),
                    ...(data.budgets || []).map(budget => budget.month)
                ]);
                for (let offset = 0; offset < 36; offset += 1) {
                    const date = new Date(now.getFullYear(), now.getMonth() - offset, 1);
                    months.add(`${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`);
                }
                months.add(selectedMonth);
                return Array.from(months).sort((a, b) => b.localeCompare(a));
            }, [data.transactions, data.budgets, selectedMonth]);

            useEffect(() => {
                if (!showMonthPicker) return;
                const previousOverflow = document.body.style.overflow;
                document.body.style.overflow = 'hidden';
                const frame = requestAnimationFrame(() => selectedMonthRef.current?.scrollIntoView({ block: 'center' }));
                return () => {
                    cancelAnimationFrame(frame);
                    document.body.style.overflow = previousOverflow;
                };
            }, [showMonthPicker]);

            const monthlyBudgets = (data.budgets || [])
                .filter(budget => budget.month === selectedMonth)
                .map(budget => {
                    const category = data.categories.find(item => item.id === budget.categoryId);
                    const spent = data.transactions
                        .filter(transaction => transaction.type === 'Expense' && transaction.categoryId === budget.categoryId && transaction.date.startsWith(selectedMonth))
                        .reduce((sum, transaction) => sum + Number(transaction.amount || 0), 0);
                    const amount = Number(budget.amount || 0);
                    return { ...budget, categoryName: category?.name || '삭제된 카테고리', amount, spent, percent: amount > 0 ? Math.round((spent / amount) * 100) : 0 };
                })
                .sort((a, b) => b.percent - a.percent);
            const totalBudget = monthlyBudgets.reduce((sum, budget) => sum + budget.amount, 0);
            const totalSpent = monthlyBudgets.reduce((sum, budget) => sum + budget.spent, 0);
            const totalPercent = totalBudget > 0 ? Math.round((totalSpent / totalBudget) * 100) : 0;

            const openCreateBudget = () => {
                setEditingBudget(null);
                setShowBudgetModal(true);
            };

            return (
                <div className="plan-page fade-in">
                    <section className="transaction-calendar-card plan-calendar-card">
                        <div className="transaction-toolbar plan-toolbar">

                    <section className="plan-overview-card">

                    {monthlyBudgets.length > 0 ? (

                                    <small>{budget.amount - budget.spent >= 0 ? `${(budget.amount - budget.spent).toLocaleString()}원 남음` : `${Math.abs(budget.amount - budget.spent).toLocaleString()}원 초과`}</small>
                                </button>

                    ) : (
                        <section className="plan-empty-state plan-empty-card">
                            <Icon name="calendar-check" size={32} />
                            <strong>등록된 예산이 없습니다</strong>
                            <p>오른쪽 위 생성 버튼을 눌러 카테고리별 월 예산을 설정해 보세요.</p>
                            <button onClick={openCreateBudget}><Icon name="plus" size={18} /> 예산 생성</button>
                        </section>

                    {showBudgetModal && <BudgetModal data={data} selectedMonth={selectedMonth} editBudget={editingBudget} setData={setData} syncToCloud={syncToCloud} onClose={() => { setShowBudgetModal(false); setEditingBudget(null); }} />}
                </div>

        function RecurringModal({ data, setData, syncToCloud, editItem, user, onClose }) {
            const today = formatLocalDate(new Date());
            const [viewportStyle, setViewportStyle] = useState({});
            const [form, setForm] = useState(() => {
                if (editItem) {
                    const linkedAsset = data.assets.find(asset => asset.id === editItem.loanAssetId);
                    return {
                        ...editItem,
                        frequency: editItem.frequency || 'monthly',
                        businessDayDirection: editItem.businessDayDirection || '',
                        loanAssetId: editItem.loanAssetId || '',
                        loanOriginalPrincipal: editItem.loanOriginalPrincipal || linkedAsset?.initialDebt || '',
                        loanStartDate: editItem.loanStartDate || editItem.startDate || today,
                        loanAnnualRate: editItem.loanAnnualRate ?? '',
                        loanTermMonths: editItem.loanTermMonths || '',
                        month: editItem.month || Number(editItem.startDate?.substring(5, 7)) || new Date().getMonth() + 1,
                        weekday: editItem.weekday ?? parseLocalDate(editItem.startDate || today).getDay()
                    };
                }
                return {
                    type: 'Expense',
                    name: '',
                    amount: '',
                    assetId: data.assets.find(asset => asset.type !== 'RealEstate')?.id || data.assets[0]?.id || '',
                    toAssetId: data.assets[1]?.id || '',
                    categoryId: data.categories.find(category => category.type === 'Expense')?.id || '',
                    startDate: today,
                    endDate: '',
                    day: new Date().getDate(),
                    month: new Date().getMonth() + 1,
                    weekday: new Date().getDay(),
                    frequency: 'monthly',
                    businessDayDirection: '',
                    loanAssetId: '',
                    loanOriginalPrincipal: '',
                    loanStartDate: today,
                    loanAnnualRate: '',
                    loanTermMonths: '',
                    active: true,
                    authorEmail: user?.email || ''
                };
            });

            useEffect(() => {
                const viewport = window.visualViewport;
                if (!viewport) return;
                const updateViewport = () => setViewportStyle({ top: `${viewport.offsetTop}px`, bottom: 'auto', height: `${viewport.height}px` });
                updateViewport();
                viewport.addEventListener('resize', updateViewport);
                viewport.addEventListener('scroll', updateViewport);
                return () => {
                    viewport.removeEventListener('resize', updateViewport);
                    viewport.removeEventListener('scroll', updateViewport);
                };
            }, []);

            const categories = data.categories.filter(category => category.type === form.type || (form.type === 'Transfer' && category.type === 'Transfer'));
            const selectedCategory = data.categories.find(category => category.id === form.categoryId);
            const isLoanPayment = form.type === 'Expense' && selectedCategory?.name === '대출';
            const loanInstallmentNumber = isLoanPayment ? getLoanInstallmentNumber(form.loanStartDate, form.startDate) : 0;
            const loanPreview = isLoanPayment ? calculateEqualPaymentInstallment(form.loanOriginalPrincipal, form.loanAnnualRate, form.loanTermMonths, loanInstallmentNumber) : null;
            const loanMaturityRawDate = loanPreview ? addLocalMonths(form.startDate, Number(form.loanTermMonths) - loanPreview.installmentNumber) : '';
            const loanMaturityDate = loanMaturityRawDate ? adjustToBusinessDay(loanMaturityRawDate, form.businessDayDirection || '') : '';
            const paymentTotal = isLoanPayment ? Number(loanPreview?.total || 0) : Number(form.amount || 0);
            const validLoanSchedule = !isLoanPayment || (!!form.loanAssetId && form.loanAnnualRate !== '' && !!loanPreview && form.loanStartDate <= form.startDate && (!!editItem || form.startDate >= today));
            const canSave = !!form.name && paymentTotal > 0 && !!form.assetId && !!form.categoryId && !!form.startDate && validLoanSchedule && (form.type !== 'Transfer' || !!form.toAssetId);

            useEffect(() => {
                if (!categories.some(category => category.id === form.categoryId)) {
                    setForm(current => ({ ...current, categoryId: categories[0]?.id || '' }));
                }
            }, [form.type]);

            const handleSubmit = event => {
                event.preventDefault();
                if (!canSave) return;
                if (isLoanPayment) {
                    const debtAsset = data.assets.find(asset => asset.id === form.loanAssetId && asset.type === 'RealEstate');
                    if (!debtAsset) {
                        alert('상환할 자산을 확인해주세요.');
                        return;
                    }
                    if (data.assets.find(asset => asset.id === form.assetId)?.type === 'RealEstate') {
                        alert('출금되는 현금 또는 금융 자산을 선택해주세요.');
                        return;
                    }
                }
                const saved = {
                    ...form,
                    id: editItem?.id || Date.now().toString(),
                    amount: paymentTotal,
                    isLoanPayment,
                    loanAssetId: isLoanPayment ? form.loanAssetId : '',
                    loanOriginalPrincipal: isLoanPayment ? Number(form.loanOriginalPrincipal || 0) : 0,
                    loanStartDate: isLoanPayment ? form.loanStartDate : '',
                    loanAnnualRate: isLoanPayment ? Number(form.loanAnnualRate || 0) : 0,
                    loanTermMonths: isLoanPayment ? Number(form.loanTermMonths || 0) : 0,
                    loanPrincipal: isLoanPayment ? Number(loanPreview?.principal || 0) : 0,
                    loanInterest: isLoanPayment ? Number(loanPreview?.interest || 0) : 0,
                    day: Math.min(Math.max(Number(form.day || 1), 1), 31),
                    month: Math.min(Math.max(Number(form.month || 1), 1), 12),
                    weekday: Math.min(Math.max(Number(form.weekday ?? 0), 0), 6),
                    frequency: isLoanPayment ? 'monthly' : (form.frequency || 'monthly'),
                    businessDayDirection: form.businessDayDirection || '',
                    endDate: isLoanPayment ? loanMaturityDate : form.endDate,
                    authorEmail: form.authorEmail || user?.email || ''
                };
                const items = data.recurringTransactions || [];
                const newData = { ...data, recurringTransactions: editItem ? items.map(item => item.id === editItem.id ? saved : item) : [...items, saved] };
                setData(newData);
                syncToCloud(newData);
                onClose();
            };

            const handleDelete = () => {
                if (!editItem || !confirm('이 반복 항목을 삭제하시겠습니까? 이미 생성된 거래내역은 유지됩니다.')) return;
                const newData = { ...data, recurringTransactions: (data.recurringTransactions || []).filter(item => item.id !== editItem.id) };
                setData(newData);
                syncToCloud(newData);
                onClose();
            };

            const focusIntoView = event => {
                const input = event.currentTarget;
                requestAnimationFrame(() => input.scrollIntoView({ block: 'center' }));
            };

            return (
                <div className="budget-modal-overlay recurring-modal-overlay" style={viewportStyle} role="presentation" onClick={onClose}>
                    <section className="budget-modal-sheet recurring-modal-sheet" role="dialog" aria-modal="true" aria-labelledby="recurring-modal-title" onClick={event => event.stopPropagation()}>
                        <header>
                            <button type="button" onClick={onClose} aria-label="닫기"><Icon name="x" size={25} /></button>
                            <strong id="recurring-modal-title">반복 {editItem ? '수정' : '추가'}</strong>
                            <button type="submit" form="recurring-form" className="budget-save-button" disabled={!canSave} aria-label="저장"><Icon name="check" size={24} /></button>
                        </header>
                        <form id="recurring-form" onSubmit={handleSubmit}>
                            <label><span>거래 유형</span><select value={form.type} onChange={event => setForm({ ...form, type: event.target.value })}><option value="Expense">지출</option><option value="Income">수입</option><option value="Transfer">이체</option></select></label>
                            <label><span>이름</span><input value={form.name} onChange={event => setForm({ ...form, name: event.target.value })} onFocus={focusIntoView} placeholder="예: 월세, 구독료" autoFocus /></label>
                            <label><span>카테고리</span><select value={form.categoryId} onChange={event => setForm({ ...form, categoryId: event.target.value })}>{categories.map(category => <option key={category.id} value={category.id}>{category.name}</option>)}</select></label>
                            {isLoanPayment ? <>
                                <label><span>자산</span><select value={form.loanAssetId || ''} onChange={event => { const loanAssetId = event.target.value; const asset = data.assets.find(item => item.id === loanAssetId); setForm({ ...form, loanAssetId, loanOriginalPrincipal: form.loanOriginalPrincipal || asset?.initialDebt || '' }); }}><option value="">선택하세요</option>{data.assets.filter(asset => asset.type === 'RealEstate').map(asset => <option key={asset.id} value={asset.id}>{asset.name}</option>)}</select></label>
                                {data.assets.filter(asset => asset.type === 'RealEstate').length === 0 && <p className="recurring-business-help">자산 페이지에서 부채가 있는 자산을 먼저 등록해주세요.</p>}
                                <label><span>최초 대출금</span><input type="text" inputMode="numeric" value={form.loanOriginalPrincipal ? Number(form.loanOriginalPrincipal).toLocaleString() : ''} onChange={event => setForm({ ...form, loanOriginalPrincipal: event.target.value.replace(/[^0-9]/g, '') })} onFocus={focusIntoView} placeholder="0원" /></label>
                                <label><span>대출 시작일</span><input type="date" value={form.loanStartDate || ''} max={form.startDate || undefined} onChange={event => setForm({ ...form, loanStartDate: event.target.value })} onFocus={focusIntoView} /></label>
                                <label><span>연 이율</span><span className="recurring-number-unit"><input type="text" inputMode="decimal" value={form.loanAnnualRate ?? ''} onChange={event => { const value = event.target.value.replace(/[^0-9.]/g, ''); if ((value.match(/\./g) || []).length <= 1) setForm({ ...form, loanAnnualRate: value }); }} onFocus={focusIntoView} placeholder="0" /><b>%</b></span></label>
                                <label><span>상환 기간</span><span className="recurring-number-unit"><input type="text" inputMode="numeric" value={form.loanTermMonths || ''} onChange={event => setForm({ ...form, loanTermMonths: event.target.value.replace(/[^0-9]/g, '') })} onFocus={focusIntoView} placeholder="360" /><b>개월</b></span></label>
                            </> : <label><span>금액</span><input type="text" inputMode="numeric" value={form.amount ? Number(form.amount).toLocaleString() : ''} onChange={event => setForm({ ...form, amount: event.target.value.replace(/[^0-9]/g, '') })} onFocus={focusIntoView} placeholder="0원" /></label>}
                            <label><span>{form.type === 'Transfer' ? '출금 자산' : '자산'}</span><select value={form.assetId} onChange={event => setForm({ ...form, assetId: event.target.value })}>{data.assets.map(asset => <option key={asset.id} value={asset.id}>{asset.name}</option>)}</select></label>
                            {form.type === 'Transfer' && <label><span>입금 자산</span><select value={form.toAssetId} onChange={event => setForm({ ...form, toAssetId: event.target.value })}>{data.assets.filter(asset => asset.id !== form.assetId).map(asset => <option key={asset.id} value={asset.id}>{asset.name}</option>)}</select></label>}
                            {isLoanPayment ? <label><span>반복 주기</span><strong>매월 · 원리금균등</strong></label> : <label><span>반복 주기</span><select value={form.frequency} onChange={event => setForm({ ...form, frequency: event.target.value })}><option value="monthly">매월</option><option value="weekly">매주</option><option value="yearly">매년</option></select></label>}
                            <label><span>{isLoanPayment ? '다음 자동 생성일' : '시작 날짜'}</span><input type="date" value={form.startDate} min={isLoanPayment && !editItem ? today : undefined} onChange={event => { const value = event.target.value; if (!value) { setForm({ ...form, startDate: '' }); return; } const date = parseLocalDate(value); setForm({ ...form, startDate: value, day: date.getDate(), month: date.getMonth() + 1, weekday: date.getDay() }); }} onFocus={focusIntoView} /></label>
                            {!isLoanPayment && form.frequency === 'weekly' && <label><span>실행 요일</span><select value={form.weekday} onChange={event => setForm({ ...form, weekday: Number(event.target.value) })}>{['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'].map((day, index) => <option key={day} value={index}>{day}</option>)}</select></label>}
                            {!isLoanPayment && form.frequency === 'yearly' && <label><span>실행 월</span><select value={form.month} onChange={event => setForm({ ...form, month: Number(event.target.value) })}>{Array.from({ length: 12 }, (_, index) => <option key={index + 1} value={index + 1}>{index + 1}월</option>)}</select></label>}
                            {!isLoanPayment && form.frequency !== 'weekly' && <label><span>{form.frequency === 'yearly' ? '실행일' : '매월 실행일'}</span><input type="number" min="1" max="31" value={form.day} onChange={event => setForm({ ...form, day: event.target.value })} onFocus={focusIntoView} /></label>}
                            <label><span>영업일 기준</span><select value={form.businessDayDirection} onChange={event => setForm({ ...form, businessDayDirection: event.target.value })}><option value="">미설정</option><option value="before">앞 (이전 영업일)</option><option value="after">뒤 (다음 영업일)</option></select></label>
                            <p className="recurring-business-help">주말 또는 한국 공휴일이면 선택한 방향의 가장 가까운 영업일에 거래가 생성됩니다.</p>
                            {isLoanPayment ? <>
                                <div className="recurring-loan-preview">
                                    <div><span>계산 회차</span><strong>{loanPreview ? `${loanPreview.installmentNumber}회 / ${Number(form.loanTermMonths).toLocaleString()}회` : '-'}</strong></div>
                                    <div><span>이번 원금</span><strong>{loanPreview ? `${loanPreview.principal.toLocaleString()}원` : '-'}</strong></div>
                                    <div><span>이번 이자</span><strong>{loanPreview ? `${loanPreview.interest.toLocaleString()}원` : '-'}</strong></div>
                                    <div className="total"><span>예상 출금액</span><strong>{loanPreview ? `${loanPreview.total.toLocaleString()}원` : '-'}</strong></div>
                                    <small>첫 상환은 대출 시작 다음 달을 1회차로 계산합니다. 이미 지난 회차는 계산에만 반영되며 거래내역에는 생성되지 않습니다.</small>
                                </div>
                                <label><span>상환 종료 예정</span><strong>{loanMaturityDate || '-'}</strong></label>
                            </> : <label><span>종료 날짜</span><input type="date" value={form.endDate || ''} min={form.startDate} onChange={event => setForm({ ...form, endDate: event.target.value })} onFocus={focusIntoView} /></label>}
                            {editItem && <button type="button" className="budget-delete-button" onClick={handleDelete}>반복 삭제</button>}
                        </form>
                    </section>
                </div>
            );
        }

        function RecurringPage({ data, setData, syncToCloud, setTab, user, isConnected }) {
            const [selectedType, setSelectedType] = useState('Expense');
            const [showModal, setShowModal] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            useMobileEdgeSwipeBack(() => setTab('home'));
            const items = data.recurringTransactions || [];
            const activeItems = items.filter(item => item.active !== false && getNextRecurringDate(item));
            const endedItems = items.filter(item => item.active === false || !getNextRecurringDate(item));
            const visibleItems = activeItems.filter(item => item.type === selectedType);

            const openCreate = () => {
                if (!isConnected) { alert('Firebase 연동이 필요합니다.'); return; }
                setEditingItem(null);
                setShowModal(true);
            };

            const getCategoryName = item => data.categories.find(category => category.id === item.categoryId)?.name || '기타';
            const getAssetName = item => data.assets.find(asset => asset.id === item.assetId)?.name || '미지정';
            const getScheduleLabel = item => {
                const frequency = item.frequency || 'monthly';
                if (frequency === 'weekly') return `매주 ${['일', '월', '화', '수', '목', '금', '토'][Number(item.weekday ?? parseLocalDate(item.startDate).getDay())]}요일`;
                if (frequency === 'yearly') return `매년 ${Number(item.month || item.startDate?.substring(5, 7))}월 ${item.day}일`;
                return `매월 ${item.day}일`;
            };
            const getBusinessDayLabel = item => item.businessDayDirection === 'before' ? ' · 영업일 앞' : item.businessDayDirection === 'after' ? ' · 영업일 뒤' : '';
            const getDday = dateString => {
                if (!dateString) return '종료';
                const today = new Date(`${formatLocalDate(new Date())}T00:00:00`);
                const target = new Date(`${dateString}T00:00:00`);
                const days = Math.round((target - today) / 86400000);
                return days === 0 ? 'D-Day' : `D-${days}`;
            };

            return (
                <div className="recurring-page fade-in">
                    <div className="recurring-toolbar">
                        <button className="transaction-round-button" onClick={() => setTab('home')} aria-label="홈으로 돌아가기"><Icon name="chevron-left" size={20} /></button>
                        <strong>반복</strong>
                        <button className={`recurring-create-button ${!isConnected ? 'btn-disabled' : ''}`} onClick={openCreate} aria-label="반복 추가"><Icon name="plus" size={22} /></button>
                    </div>

                    <div className="recurring-type-tabs">
                        {[['Expense', '지출', '#3787f6'], ['Income', '수입', '#ff982d'], ['Transfer', '이체', '#6f8394']].map(([type, label, color]) => (
                            <button key={type} className={selectedType === type ? 'active' : ''} style={{ '--tab-color': color }} onClick={() => setSelectedType(type)}>{label} <b>{activeItems.filter(item => item.type === type).length}</b></button>
                        ))}
                    </div>

                    <div className="recurring-ended-card"><span>종료된 반복</span><strong>{endedItems.length}</strong></div>

                    <div className="recurring-list">
                        {visibleItems.map(item => {
                            const nextDate = getNextRecurringDate(item);
                            return (
                                <button key={item.id} className="recurring-card" onClick={() => { setEditingItem(item); setShowModal(true); }}>
                                    <div className="recurring-card-top"><span className="recurring-icon"><Icon name="repeat-2" size={22} /></span><strong>{getDday(nextDate)}</strong></div>
                                    <div className="recurring-card-title"><strong>{item.name}</strong><b>{Number(item.amount).toLocaleString()}원</b></div>
                                    <div className="recurring-card-meta"><span><Icon name="wallet" size={15} />{getAssetName(item)}</span><span><Icon name="tag" size={15} />{getCategoryName(item)}</span></div>
                                    <div className="recurring-card-date"><span><Icon name="calendar-days" size={15} />{getScheduleLabel(item)}{getBusinessDayLabel(item)}</span><strong>{nextDate ? `${Number(nextDate.substring(0, 4))}년 ${Number(nextDate.substring(5, 7))}월 ${Number(nextDate.substring(8))}일` : '종료됨'}</strong></div>
                                </button>
                            );
                        })}
                        {visibleItems.length === 0 && <div className="recurring-empty"><Icon name="repeat-2" size={32} /><strong>등록된 반복이 없습니다</strong><p>추가 버튼을 눌러 정기적으로 자동 생성할 거래를 등록해 보세요.</p></div>}
                    </div>

                    {showModal && <RecurringModal data={data} setData={setData} syncToCloud={syncToCloud} editItem={editingItem} user={user} onClose={() => { setShowModal(false); setEditingItem(null); }} />}
                </div>
            );
        }

        function TransactionSearchInput({ value, onChange }) {
            const [inputValue, setInputValue] = useState(value);
            const composingRef = React.useRef(false);

            useEffect(() => {
                if (!composingRef.current) setInputValue(value);
            }, [value]);

            const handleChange = event => {
                setInputValue(event.target.value);
            };

            const submitSearch = event => {
                event.preventDefault();
                if (composingRef.current) return;
                onChange(inputValue.trim());
            };

            const clearSearch = () => {
                setInputValue('');
                onChange('');
            };

            return (
                <form className="transaction-inline-search fade-in" onSubmit={submitSearch} role="search">
                    <Icon name="search" size={17} />
                    <input
                        type="text"
                        value={inputValue}
                        onChange={handleChange}
                        onCompositionStart={() => { composingRef.current = true; }}
                        onCompositionEnd={() => { composingRef.current = false; }}
                        placeholder="검색어 입력 후 검색"
                        autoFocus
                        autoComplete="off"
                        enterKeyHint="search"
                    />
                    <span className="transaction-search-clear-slot">{inputValue && <button type="button" onClick={clearSearch} aria-label="검색어 지우기"><Icon name="x" size={16} /></button>}</span>
                    <button type="submit" className="transaction-search-submit" aria-label="검색 실행"><Icon name="search" size={16} /></button>
                </form>
            );
        }

        function TransactionPage({ data, setData, setEdit, setShowModal, syncToCloud, searchTerm, setSearchTerm, isConnected, authorFilter, setAuthorFilter, transactionMonth, setTransactionMonth, setTab, backTab, showMobileSearch, setShowMobileSearch }) {
            const [selectedMonth, setSelectedMonth] = useState(() => {
                if (transactionMonth) return transactionMonth;
                const now = new Date();
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

            const [showMonthPicker, setShowMonthPicker] = useState(false);
            const selectedMonthRef = React.useRef(null);

            useMobileEdgeSwipeBack(() => {
                if (showMonthPicker) setShowMonthPicker(false);

            // transactionMonth prop이 바뀌면 selectedMonth 동기화
            useEffect(() => {
                if (transactionMonth) {
                    setSelectedMonth(transactionMonth);
                    setTransactionMonth(null); // 한번 적용 후 초기화
                }

            useEffect(() => {
                if (!showMonthPicker) return;
                const previousOverflow = document.body.style.overflow;

                return () => {
                    cancelAnimationFrame(frame);
                    document.body.style.overflow = previousOverflow;
                };

            const availableMonths = useMemo(() => {
                const months = new Set(data.transactions.map(t => t.date.substring(0, 7)));
                const now = new Date();
                for (let offset = 0; offset < 36; offset += 1) {
                    const date = new Date(now.getFullYear(), now.getMonth() - offset, 1);
                    months.add(`${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`);
                }
                months.add(selectedMonth);
                return Array.from(months).sort((a, b) => b.localeCompare(a));
            }, [data.transactions, selectedMonth]);

            const del = (id) => {
                if (confirm('삭제하시겠습니까?')) {

                    setData(newData);

            const categoryById = useMemo(() => new Map(data.categories.map(category => [category.id, category])), [data.categories]);
            const assetById = useMemo(() => new Map(data.assets.map(asset => [asset.id, asset])), [data.assets]);
            const savingsCategoryIds = useMemo(() => new Set(data.categories.filter(category => category.name.includes('저축')).map(category => category.id)), [data.categories]);
            const isGlobalSearch = searchTerm.trim().length > 0;
            const filteredTransactions = useMemo(() => data.transactions.filter(t => {
                if (!isGlobalSearch && t.date.substring(0, 7) !== selectedMonth) return false;
                if (authorFilter !== 'ALL' && t.authorEmail !== authorFilter) return false;
                if (!isGlobalSearch) return true;
                const term = searchTerm.trim().toLowerCase();
                const memoMatch = t.memo?.toLowerCase().includes(term);
                const categoryMatch = categoryById.get(t.categoryId)?.name?.toLowerCase().includes(term);
                const assetMatch = assetById.get(t.assetId)?.name?.toLowerCase().includes(term);
                const toAssetMatch = t.type === 'Transfer' && assetById.get(t.toAssetId)?.name?.toLowerCase().includes(term);
                const recurringMatch = Boolean(t.recurringId) && '반복 자동 생성 정기'.includes(term);
                return memoMatch || categoryMatch || assetMatch || toAssetMatch || recurringMatch;
            }), [data.transactions, isGlobalSearch, selectedMonth, authorFilter, searchTerm, categoryById, assetById]);

            const groupedByDay = filteredTransactions.reduce((acc, t) => {
                const day = t.date; // YYYY-MM-DD
                if (!acc[day]) acc[day] = { transactions: [], income: 0, expense: 0 };
                acc[day].transactions.push(t);
                if (t.type === 'Income') acc[day].income += Number(t.amount);
                else if (t.type === 'Expense') acc[day].expense += Number(t.amount);
                return acc;
            }, {});

            const sortedDays = Object.keys(groupedByDay).sort((a, b) => b.localeCompare(a));
            const monthStats = filteredTransactions.reduce((acc, t) => {
                if (t.type === 'Income') acc.income += Number(t.amount);
                if ((t.type === 'Expense' || t.type === 'Transfer') && savingsCategoryIds.has(t.categoryId)) acc.savings += Math.abs(Number(t.amount));
                if (t.type === 'Expense' && !savingsCategoryIds.has(t.categoryId)) acc.expense += Number(t.amount);
                return acc;
            }, { income: 0, expense: 0, savings: 0 });

            const getDayLabel = (dateStr) => {
                const [dateYear, dateMonth, dateDay] = dateStr.split('-').map(Number);
                const d = new Date(dateYear, dateMonth - 1, dateDay);
                const dayNames = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
                return {
                    year: d.getFullYear(),
                    month: d.getMonth() + 1,
                    day: d.getDate(),
                    name: dayNames[d.getDay()]
                };
            };

            const categoryVisuals = {
                '식비': ['utensils', '#ff8a34'], '카페/간식': ['coffee', '#b16cea'], '외식/배달': ['shopping-bag', '#ff5d73'],
                '생활용품': ['shopping-cart', '#4f8ef7'], '교통': ['car', '#34b7c5'], '주거/통신': ['home', '#6377e6'],
                '건강': ['heart', '#2fc66d'], '문화': ['music', '#8d65d9'], '여행': ['plane', '#29a7df'],
                '교육': ['book-open', '#f0a43b'], '경조사': ['gift', '#ec6b9d'], '대출': ['landmark', '#697386'],
                '부모님': ['users', '#e98756'], '미용': ['scissors', '#dc65bb'], '용돈': ['wallet', '#58a46b'],
                '급여': ['briefcase', '#2ebd77'], '금융수입': ['trending-up', '#a24bd7'], '보너스': ['sparkles', '#f3aa2c'],
                '저축': ['piggy-bank', '#37a3dd'], '이체': ['arrow-left-right', '#6f7f90']
            };

            const getTransactionVisual = (transaction) => {
                const category = categoryById.get(transaction.categoryId);
                const categoryName = category?.name || (transaction.type === 'Transfer' ? '이체' : '기타');
                const fallback = transaction.type === 'Income' ? ['arrow-down-left', '#2ebd77'] : transaction.type === 'Transfer' ? ['arrow-left-right', '#6f7f90'] : ['ellipsis', '#8b949e'];
                const [icon, color] = categoryVisuals[categoryName] || fallback;
                return { categoryName, icon, color };
            };

            const openTransaction = (transaction) => {
                setEdit(transaction);
                setShowModal(true);
            };

            return (
                <div className="transaction-page fade-in">
                    <section className="transaction-calendar-card">
                        <div className="transaction-toolbar">
                            <button className="transaction-round-button" onClick={() => setTab(backTab)} aria-label="이전 페이지로 돌아가기"><Icon name="chevron-left" size={20} /></button>
                            <button className="transaction-month-control" onClick={() => setShowMonthPicker(true)} disabled={isGlobalSearch} aria-haspopup="dialog" aria-expanded={showMonthPicker}>
                                <strong>{isGlobalSearch ? '전체 기간' : `${selectedMonth.split('-')[0]}년 ${Number(selectedMonth.split('-')[1])}월`}</strong>
                            </button>
                            <div className="transaction-toolbar-actions">
                                <div className={`transaction-connection ${isConnected ? 'connected' : 'disconnected'}`} title={isConnected ? 'Firebase 연결됨' : 'Firebase 연결 안 됨'}>
                                    <span />
                                    <small>{isConnected ? '연결' : '미연결'}</small>
                                </div>
                                <button className={showMobileSearch ? 'active' : ''} onClick={() => setShowMobileSearch(!showMobileSearch)} aria-label="거래 검색">
                                    <Icon name="search" size={20} />
                                </button>
                            </div>
                        </div>

                        {showMobileSearch && <TransactionSearchInput value={searchTerm} onChange={setSearchTerm} />}
                    </section>

                    {showMonthPicker && (
                        <div className="month-picker-overlay" role="presentation" onClick={() => setShowMonthPicker(false)}>
                            <section className="month-picker-sheet" role="dialog" aria-modal="true" aria-labelledby="month-picker-title" onClick={event => event.stopPropagation()}>
                                <header>
                                    <button onClick={() => setShowMonthPicker(false)} aria-label="월 선택 닫기"><Icon name="x" size={27} /></button>
                                    <strong id="month-picker-title">월 선택</strong>
                                    <span />
                                </header>
                                <div className="month-picker-list">
                                    {availableMonths.map(month => (
                                        <button key={month} ref={month === selectedMonth ? selectedMonthRef : null} className={month === selectedMonth ? 'selected' : ''} onClick={() => {
                                            setSelectedMonth(month);
                                            setShowMonthPicker(false);
                                        }}>
                                            <span>{month.split('-')[0]}년 {Number(month.split('-')[1])}월</span>
                                            {month === selectedMonth && <Icon name="check" size={22} />}
                                        </button>
                                    ))}
                                </div>
                            </section>
                        </div>
                    )}

                    {(searchTerm || authorFilter !== 'ALL') && (
                        <div className="transaction-active-filters">
                            {searchTerm && (
                                <div className="transaction-filter-chip">
                                    <Icon name="filter" size={14} />
                                    <span>{searchTerm}</span>
                                    <button onClick={() => setSearchTerm('')}>
                                        <Icon name="x" size={16} />
                                    </button>
                                </div>
                            )}
                            {authorFilter !== 'ALL' && (
                                <div className="transaction-filter-chip author">
                                    <Icon name="user" size={14} />
                                    <span>{(() => { const found = (data.authorAbbreviations || []).find(a => a.email === authorFilter); return found ? found.abbr : authorFilter; })()}</span>
                                    <button onClick={() => setAuthorFilter('ALL')}>
                                        <Icon name="x" size={16} />
                                    </button>
                                </div>
                            )}
                        </div>
                    )}

                    <div className="transaction-month-summary">
                        <span>수입 <strong>+{monthStats.income.toLocaleString()}원</strong></span>
                        <span>지출 <strong>-{monthStats.expense.toLocaleString()}원</strong></span>
                        {monthStats.savings > 0 && <span>저축 <strong>{monthStats.savings.toLocaleString()}원</strong></span>}
                    </div>

                    <div className="transaction-groups">
                        {sortedDays.map(dayStr => {
                            const { transactions, income, expense } = groupedByDay[dayStr];
                            const { year, month, day, name } = getDayLabel(dayStr);
                            return (
                                <section className="transaction-day-group" key={dayStr}>
                                    <header className="transaction-day-header">
                                        <span>{isGlobalSearch && `${year}년 ${month}월 `}{day}일 {name}</span>
                                        <div>
                                            {income > 0 && <span className="income">+{income.toLocaleString()}원</span>}
                                            {expense > 0 && <span className="expense">-{expense.toLocaleString()}원</span>}
                                        </div>
                                    </header>

                                    <div className="transaction-list">
                                        {transactions.map(t => {
                                            const visual = getTransactionVisual(t);
                                            const assetName = t.type === 'Transfer'
                                                ? `${assetById.get(t.assetId)?.name || '-'} → ${assetById.get(t.toAssetId)?.name || '-'}`
                                                : assetById.get(t.assetId)?.name || '-';
                                            return (
                                                <button className="transaction-list-item" key={t.id} onClick={() => openTransaction(t)}>
                                                    <span className="transaction-category-icon" style={{ backgroundColor: visual.color }}>
                                                        <Icon name={visual.icon} size={19} />
                                                    </span>
                                                    <span className="transaction-copy">
                                                        <small>{visual.categoryName}</small>
                                                        {t.type === 'Expense' && t.isLoanPayment && <small>원금 {Number(t.loanPrincipal || 0).toLocaleString()}원 · 이자 {Number(t.loanInterest || 0).toLocaleString()}원</small>}
                                                        <span className="transaction-memo-line">
                                                            <strong>{t.memo || visual.categoryName}</strong>
                                                            {t.recurringId && <span className="transaction-recurring-mark" title="반복 자동 생성" aria-label="반복 자동 생성"><Icon name="repeat-2" size={13} /></span>}
                                                        </span>
                                                    </span>
                                                    <span className="transaction-amount-copy">
                                                        <strong className={`type-${t.type.toLowerCase()}`}>
                                                            {t.type === 'Expense' ? '-' : t.type === 'Income' ? '+' : ''}{Number(t.amount).toLocaleString()}원
                                                        </strong>
                                                        <small>{assetName}</small>
                                                    </span>
                                                    <Icon name="chevron-right" size={15} className="transaction-row-chevron" />
                                                </button>
                                            );
                                        })}
                                    </div>
                                </section>
                            );
                        })}
                        {filteredTransactions.length === 0 && (
                            <div className="transaction-empty-state">
                                <span><Icon name="receipt" size={26} /></span>
                                <strong>거래 내역이 없습니다</strong>
                                <p>이 달에 등록된 거래가 아직 없어요.</p>
                            </div>
                        )}
                    </div>

                    <div className="transaction-floating-actions">
                        <div className="transaction-floating-filter">
                            <Icon name="sliders-horizontal" size={20} />
                            <select value={authorFilter} onChange={e => setAuthorFilter(e.target.value)} aria-label="작성자 필터">
                                <option value="ALL">전체</option>
                                {Array.from(new Set(data.transactions.map(t => t.authorEmail).filter(Boolean))).map(email => {
                                    const found = (data.authorAbbreviations || []).find(a => a.email === email);
                                    return <option key={email} value={email}>{found ? found.abbr : email}</option>;
                                })}
                            </select>
                        </div>
                        <button className={`transaction-add-button ${!isConnected ? 'btn-disabled' : ''}`} onClick={() => {
                            if (!isConnected) { alert('Firebase 연동이 필요합니다.'); return; }
                            setEdit(null);
                            setShowModal(true);
                        }} aria-label="거래 추가">
                            <Icon name="plus" size={27} />
                        </button>
                    </div>
                </div>
            );
        }

        function AssetManagementPage({ data, setData, syncToCloud, setEdit, setShowModal, setTab, setSearchTerm, setEditAsset, setShowAssetModal, hideAssetAmounts }) {
            const [selectedAsset, setSelectedAsset] = useState(null);
            const [assetViewMode, setAssetViewMode] = useState('asset');
            const [stockRefreshState, setStockRefreshState] = useState({ loading: false, message: '' });
            const [showStockTransactions, setShowStockTransactions] = useState(false);

            const refreshStockPrices = async (force = false) => {
                const apiKey = data.marketDataApiKey || localStorage.getItem(TWELVE_DATA_API_KEY) || '';
                const koreaApiKeys = getKoreaMarketApiKeys(data);
                if (!apiKey && !koreaApiKeys.stock && !koreaApiKeys.etf) {
                    setStockRefreshState({ loading: false, message: '설정에서 시장 데이터 API 키를 등록해주세요.' });
                    return;
                }
                setStockRefreshState({ loading: true, message: '전일 종가와 환율을 확인하고 있습니다.' });
                const result = await refreshStockAssetQuotes(data, apiKey, force, koreaApiKeys);
                if (result.stockAssetCount === 0) {
                    setStockRefreshState({ loading: false, message: '' });
                    return;
                }
                if (!result.hasTargets) {
                    setStockRefreshState({ loading: false, message: '전일 종가가 최신 상태입니다.' });
                    return;
                }
                if (result.changed) {
                    setData(result.newData);
                    syncToCloud(result.newData);
                }
                setStockRefreshState({
                    loading: false,
                    message: result.failures.length > 0 ? `${result.refreshedCount}개 갱신 · ${result.failures[0]}` : `${result.refreshedCount}개 종목의 평가금을 갱신했습니다.`
                });
            };

            useEffect(() => {
                refreshStockPrices(false);
            }, []);

            useMobileEdgeSwipeBack(() => {
                if (showStockTransactions) setShowStockTransactions(false);
                else if (selectedAsset) setSelectedAsset(null);
                else setTab('home');
            });

            const groupGrouped = sortGroupsByPriority(data.groups)
                .map(g => {
                    const assets = data.assets.filter(a => a.groupId === g.id);
                    const total = assets.reduce((sum, a) => sum + calculateAssetBalance(a.id, data.assets, data.transactions, undefined, data.stockTransactions), 0);
                    return { ...g, total, assets };
                }).filter(g => g.assets.length > 0);

            const uncategorizedAssets = data.assets.filter(a => !a.groupId);
            const uncategorizedTotal = uncategorizedAssets.reduce((sum, a) => sum + calculateAssetBalance(a.id, data.assets, data.transactions, undefined, data.stockTransactions), 0);

            if (uncategorizedAssets.length > 0) {
                groupGrouped.push({ id: 'uncategorized', name: '미지정 그룹', total: uncategorizedTotal, assets: uncategorizedAssets, order: 999 });
            }

            const assetTypes = getAssetTypes(data);
            const typeGrouped = assetTypes.map(type => {
                const assets = data.assets
                    .filter(asset => asset.type === type.value)
                    .slice()
                    .sort((a, b) => Number(a.priority ?? 9999) - Number(b.priority ?? 9999));
                const total = assets.reduce((sum, asset) => sum + calculateAssetBalance(asset.id, data.assets, data.transactions, undefined, data.stockTransactions), 0);
                return { id: `type-${type.value}`, name: type.label, total, assets };
            }).filter(group => group.assets.length > 0);

            const knownAssetTypes = new Set(assetTypes.map(type => type.value));
            const otherAssets = data.assets.filter(asset => !knownAssetTypes.has(asset.type));
            if (otherAssets.length > 0) {
                typeGrouped.push({
                    id: 'type-other',
                    name: '기타',
                    total: otherAssets.reduce((sum, asset) => sum + calculateAssetBalance(asset.id, data.assets, data.transactions, undefined, data.stockTransactions), 0),
                    assets: otherAssets
                });
            }

            const displayedGroups = assetViewMode === 'type' ? typeGrouped : groupGrouped;

            const grandTotal = data.assets.reduce((sum, asset) => sum + calculateAssetBalance(asset.id, data.assets, data.transactions, undefined, data.stockTransactions), 0);
            const grandDebt = data.assets.reduce((sum, asset) => sum + calculateAssetDebt(asset, data.transactions), 0);
            const allocationGroups = displayedGroups
                .filter(group => group.total > 0)
                .slice()
                .sort((a, b) => b.total - a.total);
            const allocationTotal = allocationGroups.reduce((sum, group) => sum + group.total, 0);
            const allocationColors = ['#7dd3fc', '#a7f3d0', '#fde68a', '#fca5a5', '#c4b5fd', '#fdba74', '#93c5fd', '#f9a8d4'];
            const getAllocationPercent = group => allocationTotal > 0 && group.total > 0 ? (group.total / allocationTotal) * 100 : 0;

            if (showStockTransactions) {
                return <StockTransactionPage data={data} setData={setData} syncToCloud={syncToCloud} onBack={() => setShowStockTransactions(false)} hideAssetAmounts={hideAssetAmounts} />;
            }

            // 자산 거래내역 뷰
            if (selectedAsset) {
                const asset = selectedAsset;
                const txList = data.transactions
                    .filter(t => t.assetId === asset.id || t.toAssetId === asset.id)
                    .sort((a, b) => b.date.localeCompare(a.date));

                // 월별 그룹핑
                const grouped = txList.reduce((acc, t) => {
                    const month = t.date.substring(0, 7);
                    if (!acc[month]) acc[month] = { transactions: [], income: 0, expense: 0 };
                    acc[month].transactions.push(t);
                    if (t.type === 'Income' && t.assetId === asset.id) acc[month].income += Number(t.amount);
                    if (t.type === 'Transfer' && t.toAssetId === asset.id) acc[month].income += Number(t.amount);
                    if (t.type === 'Expense' && t.assetId === asset.id) acc[month].expense += Number(t.amount);
                    if (t.type === 'Transfer' && t.assetId === asset.id) acc[month].expense += Number(t.amount);
                    return acc;
                }, {});
                const sortedMonths = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

                return (
                    <div className="fade-in">
                        <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '1rem' }}>
                            <button onClick={() => setSelectedAsset(null)} className="icon-btn"><Icon name="arrow-left" /></button>
                            <h1 className="detail-title">{asset.name} 거래내역</h1>
                        </div>
                        <div className="card" style={{ overflowX: 'hidden', padding: 0 }}>
                            <table className="transaction-table">
                                <thead><tr><th>날짜</th><th className="mobile-hide">구분</th><th className="mobile-hide">카테고리</th><th>금액</th><th className="mobile-hide">자산</th><th>메모</th></tr></thead>
                                <tbody>
                                    {sortedMonths.map(month => {
                                        const [y, m] = month.split('-');
                                        const { transactions: txs, income: monthIncome, expense: monthExpense } = grouped[month];
                                        return (
                                            <React.Fragment key={month}>
                                                <tr className="subtotal-row">
                                                    <td colSpan="6">
                                                        <div className="subtotal-label">[{y}년 {m}월]</div>
                                                        <div className="subtotal-values">
                                                            {hideAssetAmounts ? '금액숨김' : `(수입: ${monthIncome.toLocaleString()} / 지출: ${monthExpense.toLocaleString()})`}
                                                        </div>
                                                    </td>
                                                </tr>
                                                {txs.map(t => (
                                                    <tr key={t.id} onClick={() => { setEdit(t); setShowModal(true); }} style={{ cursor: 'pointer' }} className="list-item">
                                                        <td style={{ fontWeight: '500' }}>{new Date(t.date).getDate()}일</td>
                                                        <td className={`type-${t.type.toLowerCase()} mobile-hide`}>{t.type === 'Income' ? '수입' : t.type === 'Expense' ? '지출' : '이체'}</td>
                                                        <td className="mobile-hide">{data.categories.find(c => c.id === t.categoryId)?.name || '-'}</td>
                                                        <td style={{ fontWeight: '600' }} className={`type-${t.type.toLowerCase()}`}>
                                                            {hideAssetAmounts ? '금액숨김' : `${t.type === 'Expense' && t.assetId === asset.id ? '-' : t.type === 'Income' && t.assetId === asset.id ? '+' : t.type === 'Transfer' && t.toAssetId === asset.id ? '+' : t.type === 'Transfer' && t.assetId === asset.id ? '-' : ''}${Number(t.amount).toLocaleString()}`}
                                                        </td>
                                                        <td className="mobile-hide">
                                                            {t.type === 'Transfer'
                                                                ? <span>{data.assets.find(a => a.id === t.assetId)?.name} → {data.assets.find(a => a.id === t.toAssetId)?.name}</span>
                                                                : <span>{data.assets.find(a => a.id === t.assetId)?.name}</span>}
                                                        </td>
                                                        <td><div style={{ maxWidth: '150px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{t.memo}</div></td>
                                                    </tr>
                                                ))}
                                            </React.Fragment>
                                        );
                                    })}
                                    {txList.length === 0 && <tr><td colSpan="6" style={{ textAlign: 'center', padding: '2rem', color: '#8b949e' }}>거래 내역이 없습니다.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            }

            return (
                <div className="asset-page fade-in">
                    <div className="asset-page-toolbar">
                        <button className="asset-back-button" onClick={() => setTab('home')} aria-label="홈으로 돌아가기"><Icon name="chevron-left" size={21} /></button>
                        <div className="asset-view-tabs asset-toolbar-tabs" role="tablist" aria-label="자산 보기 방식">

                            <button type="button" role="tab" aria-selected={assetViewMode === 'type'} className={assetViewMode === 'type' ? 'active' : ''} onClick={() => setAssetViewMode('type')}>유형별</button>
                        </div>
                        <div className="asset-toolbar-actions">
                            <button className="asset-stock-add-button" onClick={() => {
                                if (!data.assets.some(asset => asset.type === 'Stock')) {
                                    alert('먼저 주식 유형의 자산을 추가해주세요.');
                                    return;
